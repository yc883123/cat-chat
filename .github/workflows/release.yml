name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 4.1.0-beta
  RELEASE_TAG: v4.1.0-beta
  # 新名包（给人直接下载）：包内是 `cat-chat.exe`。
  PACKAGE_NAME: cat-chat-4.1.0-beta-windows-x64
  # 旧名包：只为兼容既存文档 / 教程 / 口耳相传的旧下载链接，内容与 `PACKAGE_NAME` 等价，
  # **仅包内 exe 名不同**。更新器从不消费 zip，所以它不参与自动更新链路。
  LEGACY_PACKAGE_NAME: naiba-chat-4.1.0-beta-windows-x64

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          # 构建依赖必须锁版本：2026-10-19 的 3.4.1 因未锁 PyMuPDF，构建当天上游发布
          # 2.0 大版本，PyInstaller 的 hook 还没跟上，打出的 exe 缺少文件、一启动就崩。
          python -m pip install --disable-pip-version-check --upgrade "pyinstaller==6.22.3" "pywebview==6.2.1" "pystray==0.19.5" "mcp==2.1.1" "pymupdf==1.28.2" "av==18.1.0" "python-multipart==0.0.32" "websockets==15.0.1"
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir "pillow==13.0.0"
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Run tests
        timeout-minutes: 25
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          if (-not (Test-Path "tests")) {
            throw "tests directory not found; refusing to publish without unit tests."
          }
          python -u -X faulthandler -m unittest tests.test_comfyui_batches tests.test_manju_presets tests.test_supervised_chat_recovery -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u -X faulthandler -m unittest discover -s tests -v
          exit $LASTEXITCODE

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "${{ env.RELEASE_VERSION }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          # 发布前必须让打包产物真的跑一次：--self-check 会导入 PDF/视频/子代理等全部重依赖，
          # 缺 DLL/扩展会在这里复现。用超时等待，避免导入失败时 PyInstaller 的弹窗挂住 CI。
          $proc = Start-Process -FilePath "dist\naiba-chat.exe" -ArgumentList "--self-check" -PassThru
          if (-not $proc.WaitForExit(180000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "打包产物自检超时（很可能在导入阶段弹出了错误窗口），禁止发布"
          }
          if ($proc.ExitCode -ne 0) {
            throw "打包产物自检失败（exit $($proc.ExitCode)）：exe 缺少运行文件，禁止发布"
          }
          Write-Host "打包产物自检通过（--self-check exit 0）"

      - name: Create update manifest
        shell: pwsh
        run: |
          # !!! 更新协议常量，逐字不可改 !!!
          # 仓库已更名为 cat-chat（旧地址由 GitHub 301 长期重定向），但清单这三个字段是**已发布
          # 客户端逐字校验**的协议：`repository` 必须仍是 yc883123/naiba-chat、`asset` 必须仍是
          # naiba-chat.exe、sha256 仍对 dist\naiba-chat.exe 计算。改任何一个，全部历史版本用户
          # 会永久失去自动更新，且无法用版本号界定受影响范围。详见 naiba/updater.py 模块头注释。
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $releaseNotes = @(Get-Content -Raw -Encoding UTF8 release_notes.json | ConvertFrom-Json)
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "${{ env.RELEASE_VERSION }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = $releaseNotes
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Create Windows package
        shell: pwsh
        run: |
          # 两个 zip 装的是同一份字节（cat-chat.exe 是 naiba-chat.exe 的副本，SHA-256 相同），
          # 区别只在包内 exe 的文件名：新名包给人下载，旧名包留给既存的旧链接。
          Copy-Item -LiteralPath "dist\naiba-chat.exe" -Destination "dist\cat-chat.exe" -Force
          foreach ($pair in @(
              @{ Name = "${{ env.PACKAGE_NAME }}";        Exe = "cat-chat.exe" },
              @{ Name = "${{ env.LEGACY_PACKAGE_NAME }}"; Exe = "naiba-chat.exe" }
          )) {
            $packageDir = Join-Path "dist" $pair.Name
            New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
            Copy-Item -LiteralPath "dist\$($pair.Exe)" -Destination $packageDir
            Copy-Item -LiteralPath "naiba-chat-update.json" -Destination $packageDir
            Copy-Item -LiteralPath "README.md" -Destination $packageDir
            Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\$($pair.Name).zip" -Force
          }

      - name: Publish 4.1.0 Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Cat Chat 4.1.0 Beta
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            dist/cat-chat.exe
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.LEGACY_PACKAGE_NAME }}.zip
            naiba-chat-update.json
          body: |
            Cat Chat 4.1.0 Beta：造梦机批量生成、任务总管视觉优化与 QQ 渠道接入
            ① 造梦机新增第四档「批量生成」：一个批次 = 方案列表 × 条目表。每个方案选一个工作流、配好参数映射（正文/时长/分辨率写哪个槽、哪些槽装素材），再逐条填素材、剧本、提示词、时长、分辨率与条数；一次提交即按条目顺序串行跑完，不用再一轮轮手点。批次记录存在 data/comfyui/batches/，可回看历史批次与每条状态。
            ② 批量的事务性：提交前先探活并逐条目干跑校验，全部通过才建好任务再统一入队；中途任何一条不合法就整批不落，绝不留半批孤儿任务。任务卡显示「批次名 · 条目名」，一眼看出这条属于哪批。
            ③ 批量映射按工作流记住：映射（哪个槽写正文、时长、分辨率，哪些是素材口）按工作流指纹本地保存，同一个工作流下次自动带出；槽位失效时自动按未映射处理，不静默套错位置。没映射却填了值会整单拒绝并说明，不做猜测。
            ④ 批量里的剧本转换：批头提供「剧本 → 提示词」，可用内置 H3 引导或提词库自定义模板，单条转换或全部转换，结果填进提示词并可手改。
            ⑤ 批量提交自检与跑批视图：必填素材口缺文件的条目标红、整单禁提交；可选口留空即该条不带这个口。跑批时进度条 + 每条目卡显示状态、生成中段数、失败原因；失败条目可单独重试（续跑原任务，不重新提交），产物预览走带口令的既有地址。
            ⑥ 逐次卸载：批次级「跑完一次就卸载模型」，一轮执行结束请求 ComfyUI 释放显存，受理或失败都只记录事件，不改判产物结果。
            ⑦ 任务总管视觉改版：详情区按任务类型渲染内容区（写作链、章节进度、子助手委派、目标与来源卡片），没有链式步骤时任务步骤区不再占位空挂；新建入口与流程视图重新排版。桌面与 375px 手机分别核对。
            ⑧ 任务总管多选与删除：任务列表支持多选、全选、批量删除与退出多选。删除是软删除——保留产物、批次、事件与关联会话等执行事实；运行中或停止中的任务必须先取消才能删；恢复时按归档前的状态回退，不绕过状态机直接改库。
            ⑨ 对话流式渲染改为块级增量：流式期间就按「空行 + 围栏闭合」切块排版 Markdown，稳定块只渲染一次，每帧只重绘尾块，长回复不再越输出越卡；终态仍由完整会话渲染，排版与历史一致。
            ⑩ 新增 QQ 渠道（NapCatQQ / OneBot v11）：Cat Chat 直接接 NapCat 的反向 WebSocket，不经过 AstrBot。已绑定的 QQ 私聊消息进入指定会话，AI 完整回复按 QQ 单条上限分段发回；工具仍由 Cat Chat 执行，权限与确认沿用现有规则。
            ⑪ QQ 渠道的安全口径：OneBot 专用口令与全局访问口令分开保存、分开校验；默认只监听 127.0.0.1；未在允许名单的 QQ 号不触发任何会话或模型调用，群聊默认关闭。绑定必须在本机操作，不把收到的第一条消息当成可信绑定，也不会自动创建可执行会话。
            ⑫ QQ 渠道的可靠性：message_id 持久去重，重连或重推不会重复提交任务；入站先落库再提交，崩溃后可识别未完成记录；QQ 投递失败与 Run 状态分开保存，重启后补投递未送达的分段、已确认送达的段不重发；回复在代码围栏中间断开时自动闭合围栏、下一段重新打开。
            ⑬ QQ 渠道的工具确认：待确认工具会发到绑定用户的私聊，附工具名、安全摘要、确认编号与有效期；只接受原绑定私聊用户的「确认 / 拒绝」，凭据一次性、有时效，任务结束或重启即作废；群里和换人一律不批，判断不了的明确让你回网页处理。
            ⑭ QQ 渠道的附件：只从 NapCat 给的 http(s) 直链或 OneBot 下载接口取文件，事件里出现的本地路径一律拒绝；校验文件类型与体积（单文件 80MB 上限、一次最多 8 个），落进受管 uploads 再作为会话附件提交。
            ⑮ 手机端顶栏改为两层：第一层是导航（汉堡、「新对话」、Agent 选择），第二层是轮次跳转、模型与操作按钮；按可用宽度分三档收紧（充裕 / 紧凑 / 最紧），不再把按钮挤出屏幕或互相压盖。
            ⑯ 拆书匠与织书台的阶段任务流三处修复：历史行可以正常删除、运行中禁止重复点击、「查看」不再顶掉当前正在跑的任务；总管链写完正文后按拆章范围逐章落盘。
            ⑰ 自动整理上下文的两处显示修复：交接摘要在思考模型上被独白挤到腰斩（现在正文额度与推理分开计算，并在终止原因异常时明确拦住）；另外修掉两处「看着像没压缩」的显示问题。长回复的流式渲染改为块级增量（见第 ⑨ 条）。
            ⑱ 自动化验证：本轮全量单测 4100 项通过；未定义名、ESM 链接、TDZ、文档编码与前端语法检查通过；任务总管与造梦机桌面及 375px 手机浏览器冒烟通过；QQ 渠道新增 75 项单元与端到端测试，并用本地假 NapCat 走完真实反向 WebSocket 传输（连入、鉴权、发事件、回动作响应、分段投递）。
            ⑲ 明确边界：QQ 渠道未用真实 QQ 账号与真实 NapCat 实例验收，未验证语音 / 视频 / 文件在真实 NapCat 上的实际可用性，也未验证真实供应商模型与打包后的 exe；造梦机批量未在真实 ComfyUI 上跑过真实工作流，逐条执行与产物质量未在真机验证。
            ⑳ 配置变更：启用 QQ 渠道需要在配置文件的 onebot 段填好 OneBot 口令与允许的 QQ 号；NapCat 与 Cat Chat 不同机时要显式改监听地址并自行承担端口暴露风险。既有数据位置、更新协议与双名称发布资产保持不变。
            Cat Chat 4.1.0 Beta Windows build。更新协议、既有数据位置和双名称发布资产保持兼容。
