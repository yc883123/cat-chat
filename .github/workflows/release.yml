name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 4.4.6-beta
  RELEASE_TAG: v4.4.6-beta
  # 新名包（给人直接下载）：包内是 `cat-chat.exe`。
  PACKAGE_NAME: cat-chat-4.4.6-beta-windows-x64
  # 旧名包：只为兼容既存文档 / 教程 / 口耳相传的旧下载链接，内容与 `PACKAGE_NAME` 等价，
  # **仅包内 exe 名不同**。更新器从不消费 zip，所以它不参与自动更新链路。
  LEGACY_PACKAGE_NAME: naiba-chat-4.4.6-beta-windows-x64

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  # 全量单测约 800s，占整轮 16 分钟里的 13 分钟（Build executable 只有 64s），所以只拆测试：
  # 按 .github/test-shards.json 的实测配平分四片并行，构建与发布等四片全绿再跑。
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up validated Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/release.yml

      - name: Install build dependencies
        run: |
          # 与 release 作业同一份锁定版本：测试会导入 pywebview / PyInstaller 相关模块，
          # 少装任何一个都会让某一片整片 ImportError。
          python -m pip install --disable-pip-version-check --upgrade "pyinstaller==6.22.3" "pywebview==6.2.1" "pystray==0.19.5" "mcp==2.1.1" "pymupdf==1.28.2" "av==18.1.0" "python-multipart==0.0.32" "websockets==15.0.1"
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir "pillow==13.0.0"
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Run tests (shard ${{ matrix.shard }})
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          if (-not (Test-Path "tests")) {
            throw "tests directory not found; refusing to publish without unit tests."
          }
          # 分片清单是静态文件（按本机实测耗时配平）；新增或改名测试模块必须先登记，否则
          # 它会静默漏跑——这里的比对就是那道闸门。
          $shards = Get-Content -Raw .github/test-shards.json | ConvertFrom-Json
          $assigned = @($shards | ForEach-Object { $_ }) | Sort-Object
          $all = Get-ChildItem tests -Filter "test_*.py" | ForEach-Object { $_.BaseName } | Sort-Object
          $diff = Compare-Object $all $assigned
          if ($diff) {
            throw "分片清单与 tests/ 不一致，请更新 .github/test-shards.json：$($diff | Out-String)"
          }
          $mine = @($shards[${{ matrix.shard }}])
          Write-Host "shard ${{ matrix.shard }}: $($mine.Count) modules"
          # discover 会把 tests/ 加进 sys.path，个别用例按裸名导入同目录桩（tool_testkit），
          # 显式列模块名时要自己补上，否则那几片会整片 ImportError。
          $env:PYTHONPATH = (Join-Path $PWD "tests")
          python -u -X faulthandler -m unittest $(($mine | ForEach-Object { "tests.$_" })) -v
          exit $LASTEXITCODE

  release:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up validated Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"

      - name: Check Node.js startup
        shell: pwsh
        run: |
          # 与本机通过完整回归的版本一致，先确认执行路径和进程能正常退出。
          Write-Host "Node path: $((Get-Command node).Source)"
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -e "console.log('NODE_STARTUP_OK', process.version, process.execPath)"
          exit $LASTEXITCODE

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/release.yml

      - name: Install build dependencies
        run: |
          # 构建依赖必须锁版本：2026-10-19 的 3.4.1 因未锁 PyMuPDF，构建当天上游发布
          # 2.0 大版本，PyInstaller 的 hook 还没跟上，打出的 exe 缺少文件、一启动就崩。
          python -m pip install --disable-pip-version-check --upgrade "pyinstaller==6.22.3" "pywebview==6.2.1" "pystray==0.19.5" "mcp==2.1.1" "pymupdf==1.28.2" "av==18.1.0" "python-multipart==0.0.32" "websockets==15.0.1"
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir "pillow==13.0.0"
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "${{ env.RELEASE_VERSION }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          # 发布前必须让打包产物真的跑一次：--self-check 会导入 PDF/视频/子代理等全部重依赖，
          # 缺 DLL/扩展会在这里复现。用超时等待，避免导入失败时 PyInstaller 的弹窗挂住 CI。
          $proc = Start-Process -FilePath "dist\naiba-chat.exe" -ArgumentList "--self-check" -PassThru
          if (-not $proc.WaitForExit(180000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "打包产物自检超时（很可能在导入阶段弹出了错误窗口），禁止发布"
          }
          if ($proc.ExitCode -ne 0) {
            throw "打包产物自检失败（exit $($proc.ExitCode)）：exe 缺少运行文件，禁止发布"
          }
          Write-Host "打包产物自检通过（--self-check exit 0）"

      - name: Create update manifest
        shell: pwsh
        run: |
          # !!! 更新协议常量，逐字不可改 !!!
          # 仓库已更名为 cat-chat（旧地址由 GitHub 301 长期重定向），但清单这三个字段是**已发布
          # 客户端逐字校验**的协议：`repository` 必须仍是 yc883123/naiba-chat、`asset` 必须仍是
          # naiba-chat.exe、sha256 仍对 dist\naiba-chat.exe 计算。改任何一个，全部历史版本用户
          # 会永久失去自动更新，且无法用版本号界定受影响范围。详见 naiba/updater.py 模块头注释。
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $releaseNotes = @(Get-Content -Raw -Encoding UTF8 release_notes.json | ConvertFrom-Json)
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "${{ env.RELEASE_VERSION }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = $releaseNotes
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Create Windows package
        shell: pwsh
        run: |
          # 两个 zip 装的是同一份字节（cat-chat.exe 是 naiba-chat.exe 的副本，SHA-256 相同），
          # 区别只在包内 exe 的文件名：新名包给人下载，旧名包留给既存的旧链接。
          Copy-Item -LiteralPath "dist\naiba-chat.exe" -Destination "dist\cat-chat.exe" -Force
          foreach ($pair in @(
              @{ Name = "${{ env.PACKAGE_NAME }}";        Exe = "cat-chat.exe" },
              @{ Name = "${{ env.LEGACY_PACKAGE_NAME }}"; Exe = "naiba-chat.exe" }
          )) {
            $packageDir = Join-Path "dist" $pair.Name
            New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
            Copy-Item -LiteralPath "dist\$($pair.Exe)" -Destination $packageDir
            Copy-Item -LiteralPath "naiba-chat-update.json" -Destination $packageDir
            Copy-Item -LiteralPath "README.md" -Destination $packageDir
            Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\$($pair.Name).zip" -Force
          }

      - name: Publish 4.4.6 Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Cat Chat 4.4.6 Beta
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            dist/cat-chat.exe
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.LEGACY_PACKAGE_NAME }}.zip
            naiba-chat-update.json
          body: |
            Cat Chat 4.4.6 Beta：造梦机历史分页、拆书匠分镜选版与织书台 TXT 续写
            造梦机单次和批量历史支持连续分页，历史记录可访问数量不再封顶；列表只渲染当前窗口，图片和视频进入可视范围后再加载，减少长历史的页面开销。每批生成条目的业务限制不变。
            查看历史批次后返回批量生成，恢复原来的工作流参数草稿；只有明确点击编辑批次才回填历史参数。刷新、删除和新提交保持已加载历史，迟到回包不会恢复已删除记录。
            再次生成快照开放「设置高级参数」，可调整本次显示项和顺序；隐藏字段保留原覆盖或已修改值，「默认」恢复快照参数，清空固定种子后按随机提交，原工作流设置不被改写。
            拆书匠大纲可选择已保存版本接续，默认仍按本批素材生成；兼容只有单份大纲的旧作品，预检不改旧稿，保存追加新版本并保留旧内容。
            拆书匠要素、大纲、剧本的当前或历史已完成任务可另存新版本，已保存任务防止重复写入；历史结果保存不干扰正在运行的任务，完成正文优先读取持久结果，修复任务详情来源字段导致保存按钮不可用的问题。
            剧本生成说明随人物设定和大纲选版即时更新，实际引用与预算由预检确认；切换输入清除旧预算，修复重复版本标签与部分记录状态显示。
            分镜新增剧本版本选择，单版也显示所用版号，沿用剧本页选择；场次数、预检和实际生成统一使用所选版本。任务冻结版号及正文，源版本后来修改或删除也不改变重试输入；修复切版和任务详情迟到回包造成的显示倒退。
            织书台支持直接上传 TXT 续写，也可选择拆书匠原文或逐章改编稿；确认人物、关系、剧情现状和后续大纲后，在选定末章后创建新章，导入旧章保持只读。支持 UTF-8 与 GB18030，重复提交沿用请求标识避免重复建书。
            首次配置供应商时可自动检测并选择模型，也可手动填写；修改连接或返回后，旧检测结果不会覆盖当前选择。新增、编辑或删除 API 配置后，工作台与任务总管的模型列表即时刷新，并保留有效选择和草稿。
            源码维护工具新增缓存诊断包，生成脱敏报告；配套测试使用本地假服务，不读取真实配置或调用付费接口。
            验证：本地全量 4830 项测试通过（1 项按环境跳过），静态与文档检查通过；造梦机、拆书匠、织书台、首启模型选择均完成桌面和 375px Playwright 验收。生成验证使用隔离数据和本地替身，未执行真实付费模型或 ComfyUI 生成。
            Cat Chat 4.4.6 Beta Windows build。保留现有数据位置、更新协议以及双名称 exe 和 zip 资产。
