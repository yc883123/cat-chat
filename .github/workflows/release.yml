name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 2.9.9-beta
  RELEASE_TAG: v2.9.9-beta
  # 新名包（给人直接下载）：包内是 `cat-chat.exe`。
  PACKAGE_NAME: cat-chat-2.9.9-beta-windows-x64
  # 旧名包：只为兼容既存文档 / 教程 / 口耳相传的旧下载链接，内容与 `PACKAGE_NAME` 等价，
  # **仅包内 exe 名不同**。更新器从不消费 zip，所以它不参与自动更新链路。
  LEGACY_PACKAGE_NAME: naiba-chat-2.9.9-beta-windows-x64

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pyinstaller pywebview pystray "mcp==2.1.1" pymupdf "av==18.1.0" python-multipart
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir pillow
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Run tests
        shell: pwsh
        run: |
          if (-not (Test-Path "tests")) {
            Write-Host "tests directory not found; skipping unit tests."
            exit 0
          }
          $attempts = 2
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $attempts) {
              Write-Host "Tests failed on attempt $attempt; retrying once."
            }
          }
          exit 1

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "${{ env.RELEASE_VERSION }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Create update manifest
        shell: pwsh
        run: |
          # !!! 更新协议常量，逐字不可改 !!!
          # 仓库已更名为 cat-chat（旧地址由 GitHub 301 长期重定向），但清单这三个字段是**已发布
          # 客户端逐字校验**的协议：`repository` 必须仍是 yc883123/naiba-chat、`asset` 必须仍是
          # naiba-chat.exe、sha256 仍对 dist\naiba-chat.exe 计算。改任何一个，全部历史版本用户
          # 会永久失去自动更新，且无法用版本号界定受影响范围。详见 naiba/updater.py 模块头注释。
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $releaseNotes = @(Get-Content -Raw -Encoding UTF8 release_notes.json | ConvertFrom-Json)
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "${{ env.RELEASE_VERSION }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = $releaseNotes
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Create Windows package
        shell: pwsh
        run: |
          # 两个 zip 装的是同一份字节（cat-chat.exe 是 naiba-chat.exe 的副本，SHA-256 相同），
          # 区别只在包内 exe 的文件名：新名包给人下载，旧名包留给既存的旧链接。
          Copy-Item -LiteralPath "dist\naiba-chat.exe" -Destination "dist\cat-chat.exe" -Force
          foreach ($pair in @(
              @{ Name = "${{ env.PACKAGE_NAME }}";        Exe = "cat-chat.exe" },
              @{ Name = "${{ env.LEGACY_PACKAGE_NAME }}"; Exe = "naiba-chat.exe" }
          )) {
            $packageDir = Join-Path "dist" $pair.Name
            New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
            Copy-Item -LiteralPath "dist\$($pair.Exe)" -Destination $packageDir
            Copy-Item -LiteralPath "naiba-chat-update.json" -Destination $packageDir
            Copy-Item -LiteralPath "README.md" -Destination $packageDir
            Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\$($pair.Name).zip" -Force
          }

      - name: Publish 2.9.9 Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Cat Chat 2.9.9 Beta
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            dist/cat-chat.exe
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.LEGACY_PACKAGE_NAME }}.zip
            naiba-chat-update.json
          body: |
            Cat Chat 2.9.9 Beta Windows build from `${{ github.sha }}`。
            
            > **关于文件名的说明**：仓库已更名为 `cat-chat`（旧链接由 GitHub 自动跳转）。本次 Release 同时提供 `cat-chat.exe` 与 `naiba-chat.exe`——**这是同一个文件，SHA-256 完全相同**；两个 ZIP 内容也等价，只有包内 exe 的文件名不同。应用内自动更新仍使用 `naiba-chat.exe` 资产与原有清单协议，**你不需要做任何操作**，已安装的旧版本会照常收到更新。
            
            **本次变化：设置页「用量统计」原地升级成分析视图 + 手机端弹层软键盘裁切修复。** 直接覆盖安装即可，**不需要迁移数据，也不需要重新配置**；无数据库结构变化，历史会话、收藏、分支、API 卡片、Agent、Skill 与 MCP 配置原样保留。
            
            本次更新（完整清单见 `release_notes.json` / 应用内「更新说明」）：
            - **用量分析视图**：「用量统计」从纯表格升级成分析面板——KPI 六卡（总调用 / 总耗费 / 总 TOKEN / 每分钟调用 / 每分钟 TOKEN / 缓存命中率）+ 五张手绘 SVG 图表（调用分布、调用趋势、API 供应商对比、缓存命中率、供应商→模型两层桑基），不引入第三方图表库。
            - **时间与粒度**：今天 / 7 / 14 / 29 天快选；「筛选」弹窗支持自定义起止时间；分桶粒度小时 | 天一键切换。
            - **维度与口径**：模型 | API 供应商两维度切换（纯前端重渲染不二次请求）；柱状 ↔ 面积、花费 ↔ Token 两套口径；图例点击隐藏 / 恢复系列。
            - **费用口径**：多币种各自原值分列、不混加；$ 按 7.2 汇率折算进柱高，明细与浮层仍显示原值；费用恒按当前单价重算；未定价模型只计用量不计费、显式标注。
            - **偏好弹窗**：默认窗口 / 粒度 / 图表 / 指标四项存服务端配置（`settings.usage_dash`），重启保留。
            - **手机端弹层修复**：@ 工作区引用 / Skill 引用 / 文件引用弹层定位改按可视视口（visualViewport）计算，软键盘弹出时不再被裁掉上半截；重定位跟随键盘开合；用量筛选 / 偏好弹窗同样压进可视区。
            
            本地验证：全量单测 **2055 例通过**（新增守门 18 例）；Playwright 真后端隔离实例冒烟 23 项断言 + 手机软键盘弹层冒烟 19 项全绿；发版前重编 exe 并跑打包资源探针（前端文件逐字节比对 + 指纹、public/skills 全树比对）全部通过。release.yml 经真解析核对（YAML 合法）；两份清单 JSON 合法。
            
            The application verifies `naiba-chat.exe` against the SHA-256 value
            in `naiba-chat-update.json` before installing an update.
