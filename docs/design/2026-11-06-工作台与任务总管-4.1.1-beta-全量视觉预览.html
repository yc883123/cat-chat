.ws-cols{display:grid;grid-template-columns:216px minmax(0,1fr) 300px;gap:0;flex:1;min-height:0}
.col{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line);background:var(--surface)}
.col:last-child{border-right:0;background:var(--surface-inset)}
.col-head{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line);flex:none;min-height:44px}
.col-head strong{font-size:12.5px;font-weight:700}
.col-head .sp{flex:1}
.col-body{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;flex:1}
.mob-tabs{display:none}
/* 提词库：分类 + 行 */
.cats{display:flex;flex-wrap:wrap;gap:5px}
.cat{padding:4px 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--muted);font-size:11px;white-space:nowrap}
.cat.on{background:var(--accent-soft);border-color:var(--violet-line);color:var(--violet-deep);font-weight:700}
.cat em{font-style:normal;opacity:.65;margin-left:4px;font-size:10px}
.rows{display:flex;flex-direction:column;gap:4px}
.row{position:relative;display:grid;gap:5px;width:100%;padding:9px 26px 9px 10px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left}
.row:hover{background:var(--surface-2)}
.row.on{border-color:var(--violet-line);background:var(--accent-soft)}
.row b{font-size:12px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rchips{display:flex;gap:4px;flex-wrap:wrap}
.row .rchips em{font-style:normal;font-size:9.8px;padding:1px 6px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.row .fav{position:absolute;right:6px;top:8px;border:0;background:transparent;color:var(--muted);font-size:13px;line-height:1;padding:2px}
.row .fav.on{color:var(--warning)}
/* 详情卡 */
.d-title{font-size:17px;font-weight:700;line-height:1.4}
.d-sum{font-size:11.5px;color:var(--muted);line-height:1.7}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.mini{padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-inset)}
.mini b{display:block;font-size:12px;font-weight:650}
.mini small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px;line-height:1.5}
.act-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:auto;padding-top:12px}
.stream{font-size:11.8px;line-height:1.8;color:var(--text);white-space:pre-wrap}
.stream .lbl{color:var(--violet-deep);font-weight:700}
.hist{display:flex;flex-direction:column;gap:6px}
.hist-row{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:11.5px}
.hist-row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hist-row small{color:var(--muted);font-size:10px;flex:none}
/* 阶段条 */
.stagebar{display:flex;gap:5px;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;overflow-x:auto}
.stagebar span{flex:1;min-width:78px;text-align:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted);font-size:11.5px;white-space:nowrap}
.stagebar span.done{background:var(--success-soft);color:var(--success);border-color:color-mix(in srgb,var(--success) 30%,var(--line))}
.stagebar span.on{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;font-weight:700}
.page-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex:none;flex-wrap:wrap}
.page-head h2{font-size:14px;font-weight:700}
.page-head .sp{flex:1}
/* 造梦机批量档 */
.batch-wrap{padding:12px;display:grid;gap:10px;overflow:auto;min-height:0;flex:1}
.scheme{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);overflow:hidden}
.scheme-h{display:flex;align-items:center;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.scheme-b{padding:10px 11px}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{text-align:left;background:var(--surface-inset);color:var(--muted);font-size:10.5px;font-weight:600;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:var(--surface-inset)}
.slot{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:10.5px;color:var(--muted);white-space:nowrap}
.slot b{color:var(--text);font-family:var(--font-mono);font-size:10px}
.media-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ph.tall{aspect-ratio:16/10}

/* ═══ 6. 任务总管 ═══ */
.sa{display:grid;grid-template-columns:var(--sa-w) minmax(0,1fr) var(--sa-side);grid-template-rows:58px minmax(0,1fr);flex:1;min-height:0;background:color-mix(in srgb,var(--accent-soft) 28%,var(--surface))}
.sa-left{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;min-height:0;background:var(--sidebar);color:var(--sidebar-text);border-right:1px solid var(--sidebar-line)}
.sa-brand{display:flex;align-items:center;gap:10px;padding:16px 15px 12px}
.sa-mark{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid #A28DFF;border-radius:10px;background:linear-gradient(145deg,#A78BFA,#7254E5);color:#fff;font-size:16px;font-weight:700;box-shadow:0 3px 14px rgba(var(--brand-500-rgb),.35)}
.sa-brand strong{display:block;font-size:14px;font-weight:650;line-height:1.3}
.sa-brand small{display:block;color:var(--sidebar-muted);font-size:10.5px}
.sa-nav{display:flex;gap:3px;margin:0 12px;padding:3px;border-radius:var(--r-md);background:var(--sidebar-hover);flex:none}
.sa-nav button{flex:1;border:0;border-radius:6px;padding:6px 3px;background:transparent;color:var(--sidebar-muted);font-size:11.5px;white-space:nowrap}
.sa-nav button.on{background:rgba(var(--brand-500-rgb),.27);color:#fff;font-weight:700}
.sa-new{margin:12px 12px 9px;min-height:38px;display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid rgba(155,130,255,.5);border-radius:var(--r-md);background:rgba(var(--brand-500-rgb),.18);color:var(--sidebar-text);font-size:12.5px;font-weight:650}
.sa-new:hover{background:rgba(var(--brand-500-rgb),.3)}
.sa-panel-h{display:flex;align-items:center;justify-content:space-between;padding:5px 16px 4px;color:var(--sidebar-muted);font-size:11px;flex:none}
.sa-filters{display:flex;flex-wrap:wrap;gap:4px;padding:0 12px 6px;flex:none}
.sa-filters button{border:0;border-radius:6px;padding:4px 8px;background:transparent;color:var(--sidebar-muted);font-size:10.8px}
.sa-filters button.on{background:var(--sidebar-hover);color:var(--sidebar-text);font-weight:650}
.sa-list{display:flex;flex-direction:column;gap:5px;padding:6px 9px;overflow:auto;min-height:0;flex:1}
.sa-row{position:relative;display:flex;gap:5px;align-items:stretch}
.sa-task{flex:1;min-width:0;display:grid;gap:5px;padding:10px 10px;border:1px solid transparent;border-radius:var(--r-md);background:transparent;color:var(--sidebar-text);text-align:left}
.sa-task:hover{background:var(--sidebar-hover)}
.sa-task.on{border-color:rgba(162,141,255,.4);background:rgba(var(--brand-500-rgb),.2)}
.sa-task strong{display:flex;align-items:center;gap:7px;font-size:11.8px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa-task .ti{width:19px;height:19px;flex:none;display:grid;place-items:center;border-radius:5px;background:rgba(255,255,255,.05);color:var(--sidebar-muted);font-size:11px;font-style:normal}
.sa-task .state{display:flex;align-items:center;gap:6px;padding-left:26px;color:var(--sidebar-muted);font-size:10.8px}
.sa-task .state i{width:6px;height:6px;border-radius:50%;background:var(--muted);flex:none}
.sa-task .state[data-s="active"] i,.sa-task .state[data-s="running"] i{background:var(--success)}
.sa-task .state[data-s="waiting"] i,.sa-task .state[data-s="draft"] i{background:var(--warning)}
.sa-task .state[data-s="completed"] i,.sa-task .state[data-s="succeeded"] i{background:#65A9E8}
.sa-task .state[data-s="failed"] i,.sa-task .state[data-s="cancelled"] i{background:var(--danger)}
.sa-task small{padding-left:26px;color:var(--sidebar-muted);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa-del{width:24px;flex:none;border:0;background:transparent;color:var(--sidebar-muted);font-size:11px;opacity:0}
.sa-row:hover .sa-del{opacity:1}
.sa-note{margin-top:auto;padding:12px 16px;border-top:1px solid var(--sidebar-line);color:var(--sidebar-muted);font-size:10.5px;flex:none}
.sa-note::before{content:"";display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:var(--success)}
.sa-top{grid-column:2/4;grid-row:1;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--surface);min-width:0}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;min-width:0}
.crumb strong{color:var(--text);font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sa-sync{margin-left:auto;color:var(--muted);font-size:10.8px;white-space:nowrap}
.sa-mid{grid-column:2;grid-row:2;overflow:auto;min-height:0;padding:22px 24px 36px}
.sa-right{grid-column:3;grid-row:2;overflow:auto;min-height:0;padding:12px 14px 24px;display:flex;flex-direction:column;gap:11px;background:var(--surface-inset);border-left:1px solid var(--line)}
.sa-right>section{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);box-shadow:var(--shadow-1);padding:13px}
.sa-h1{font-size:var(--h1);font-weight:700;line-height:1.4;letter-spacing:-.3px;overflow-wrap:anywhere}
.sa-goal{margin-top:5px;color:var(--muted);font-size:12px;line-height:1.65}
.sa-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sa-eyebrow{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;margin-bottom:7px}
.sa-eyebrow span{color:var(--accent);font-size:16px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin:18px 0}
.metric{display:flex;flex-direction:column;gap:6px;padding:13px 14px;border:1px solid var(--line);border-radius:var(--card-r);background:var(--surface);box-shadow:var(--shadow-1);min-width:0}
.metric.wide{grid-column:1/-1}
.metric h4{margin:0;font-size:11px;color:var(--muted);font-weight:500}
.metric strong{font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.metric small{font-size:10.8px;color:var(--muted);line-height:1.5}
.focus{margin:0 0 18px;padding:15px 16px;border:1px solid color-mix(in srgb,var(--warning) 42%,var(--line));border-radius:var(--card-r);background:linear-gradient(180deg,color-mix(in srgb,var(--warning-soft) 72%,var(--surface)),var(--surface));box-shadow:var(--shadow-1)}
.focus.run{border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--accent-soft) 55%,var(--surface)),var(--surface))}
.focus.done{border-color:color-mix(in srgb,#65A9E8 40%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,#65A9E8 10%,var(--surface)),var(--surface))}
.focus.fail{border-color:color-mix(in srgb,var(--danger) 42%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--danger-soft) 60%,var(--surface)),var(--surface))}
.focus-t{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--warning)}
.focus.run .focus-t{color:var(--accent-solid)}
.focus.done .focus-t{color:#4F96D8}
.focus.fail .focus-t{color:var(--danger)}
.focus h3{margin:8px 0 5px;font-size:14.5px;font-weight:700;line-height:1.45}
.focus p{color:var(--muted);font-size:12px;line-height:1.7}
.focus .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.zone{display:grid;gap:12px;margin-bottom:18px;padding:14px;border:1px solid var(--line);border-radius:var(--card-r);background:var(--surface);box-shadow:var(--shadow-1);min-width:0}
.zone-tag{display:inline-flex;align-items:center;gap:6px;justify-self:start;padding:2px 9px;border:1px dashed var(--accent);border-radius:99px;color:var(--accent-solid);font-size:10.8px;font-weight:650;background:var(--accent-soft)}
.zone-tag i{width:6px;height:6px;border-radius:50%;background:var(--accent-solid)}
.track{display:grid;gap:0}
.track.t4{grid-template-columns:repeat(4,minmax(0,1fr))}
.track.t5{grid-template-columns:repeat(5,minmax(0,1fr))}
.node{position:relative;padding:0 8px 0 0;min-width:0}
.node .dot{position:relative;z-index:2;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--line-strong);border-radius:50%;background:var(--surface);color:var(--muted);font-size:11px;font-weight:700}
.node .ln{position:absolute;left:26px;top:13px;right:0;height:1.5px;background:var(--line-strong)}
.node:last-child .ln{display:none}
.node.done .dot{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.node.done .ln{background:var(--success)}
.node.cur .dot{border-color:var(--accent-solid);background:var(--accent-solid);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.node.gate .dot{border-style:dashed;border-color:var(--info);color:var(--info)}
.node b{display:block;margin-top:7px;font-size:11.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node small{display:block;color:var(--muted);font-size:10.5px;line-height:1.5}
.chapters{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:5px}
.ch{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:var(--surface-inset);font-size:10.5px;color:var(--muted)}
.ch.done{background:var(--success-soft);border-color:var(--success);color:var(--success);font-weight:700}
.ch.pending{opacity:.55}
.gate-card{display:flex;align-items:flex-start;gap:10px;padding:11px;border:1px dashed var(--info);border-radius:10px;background:var(--surface-inset)}
.gate-card p{margin:3px 0 0;color:var(--muted);font-size:10.8px;line-height:1.6}
.list-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-inset);font-size:11.5px;min-width:0}
.list-row b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-row em{font-style:normal;color:var(--muted);font-size:10.5px;flex:none}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mode-card{padding:11px;border:1px solid var(--line);border-radius:var(--card-r);background:var(--surface-inset)}
.mode-card.on{border-color:var(--accent);background:var(--accent-soft)}
.mode-card p{margin:4px 0 0;color:var(--muted);font-size:10.8px;line-height:1.55}
.mirror{padding:11px 12px;border:1px solid var(--warning);border-radius:10px;background:var(--warning-soft);font-size:11.5px;line-height:1.65}
.source{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:11px;padding:12px;border:1px solid var(--line);border-radius:var(--card-r);background:var(--surface-inset)}
.source .si{width:42px;height:42px;display:grid;place-items:center;border-radius:11px;background:var(--accent-soft);color:var(--accent-solid);font-size:17px;font-style:normal}
.source p{margin:3px 0 0;color:var(--muted);font-size:10.8px;line-height:1.6}
.delegates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.delegate{padding:11px;border:1px solid var(--line);border-radius:var(--card-r);background:var(--surface-inset);min-width:0}
.delegate .dh{display:flex;align-items:center;gap:8px}
.delegate .di{width:27px;height:27px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--accent-soft);color:var(--accent-solid);font-style:normal;font-size:12px}
.delegate p{margin:7px 0 0;color:var(--muted);font-size:10.8px;line-height:1.6;min-height:32px}
.delegate .df{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.approval{padding:12px;border:1px solid var(--warning);border-radius:var(--card-r);background:var(--warning-soft);min-width:0}
.approval .acts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.param-mask{margin-top:8px;padding:8px 10px;border:1px dashed var(--line-strong);border-radius:9px;background:var(--surface);font-size:10.8px;color:var(--muted);font-family:var(--font-mono)}
.batches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.batch{border:1px solid var(--line);border-radius:var(--card-r);background:var(--surface);overflow:hidden;min-width:0}
.batch .bm{position:relative;aspect-ratio:16/10;display:grid;place-items:center;font-size:10px;color:rgba(255,255,255,.85)}
.batch .bt{position:absolute;left:7px;top:7px;padding:2px 7px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;font-size:10px}
.batch .bb{padding:9px 10px}
.batch .bb p{margin:4px 0 0;color:var(--muted);font-size:10.5px;line-height:1.5;height:31px;overflow:hidden}
.checks{display:grid;gap:7px}
.check{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.check i{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--success-soft);color:var(--success);font-size:11px;font-weight:700;font-style:normal;flex:none}
.check.warn i{background:var(--warning-soft);color:var(--warning)}
.check b{color:var(--text);font-weight:600}
.timeline{display:flex;flex-direction:column;gap:7px}
.tl{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:11.5px}
.tl time{color:var(--muted);font-size:10.5px;flex:none;font-family:var(--font-mono)}
.tl p{color:var(--muted);font-size:10.8px;margin-top:2px;line-height:1.55}
.art{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.art:last-child{border-bottom:0}
.art .thumb{width:36px;height:36px;flex:none;border-radius:8px}
.art b{display:block;font-size:11.5px;font-weight:650;overflow-wrap:anywhere}
.art small{display:block;color:var(--muted);font-size:10.5px;margin-top:2px}
.link-row{display:flex;align-items:center;gap:7px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface-inset);font-size:11px;margin-top:7px}
.link-row svg{width:13px;height:13px;color:var(--accent-solid)}

/* ═══ 7. 弹窗（三段式 .sa-dialog 口径）═══ */
.mask{position:absolute;inset:0;z-index:60;background:rgba(14,17,30,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px}
html[data-theme="dark"] .mask{background:rgba(4,6,14,.72)}
.mask.on{display:flex}
.dlg{width:min(var(--dw,720px),100%);max-height:min(86dvh,760px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-3);overflow:hidden}
.dlg-h{flex:none;display:flex;align-items:flex-start;gap:12px;padding:16px 19px;border-bottom:1px solid var(--line)}
.dlg-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent-solid);font-size:16px;font-style:normal}
.dlg-h>div{flex:1;min-width:0}
.dlg-h h2{margin:0;font-size:15.5px;font-weight:700}
.dlg-h p{margin:3px 0 0;color:var(--muted);font-size:11.5px;line-height:1.55}
.dlg-b{flex:1;min-height:0;overflow:auto;padding:17px 19px;display:grid;gap:10px;align-content:start}
.dlg-f{flex:none;display:flex;align-items:center;gap:10px;padding:13px 19px;border-top:1px solid var(--line)}
.dlg-f .fh{flex:1;color:var(--muted);font-size:11px;line-height:1.55}
.dlg-f .fb{display:flex;gap:8px;flex:none}
.lg-head{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.lg-head h3{font-size:12px;font-weight:700}

.spec{flex:1;min-height:0;overflow:auto;padding:22px 26px 40px;background:var(--bg)}

.spec-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.spec-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--card-r);box-shadow:var(--shadow-1);padding:16px;min-width:0}
.spec-card h2{font-size:14px;font-weight:700;margin-bottom:4px}
.spec-card .desc{color:var(--muted);font-size:11px;line-height:1.65;margin-bottom:12px}
.swatches{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.sw{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.sw i{display:block;height:36px}
.sw span{display:block;padding:4px 5px;font-size:9.5px;color:var(--muted);line-height:1.35}

.spec-table{width:100%;border-collapse:collapse;font-size:11.5px}
.spec-table th{background:var(--surface-inset);font-size:10.5px}
.spec-table td code{font-family:var(--font-mono);font-size:10.5px;color:var(--accent-solid)}
.spec-table td:first-child{font-family:var(--font-mono);font-size:10.8px;color:var(--text);white-space:nowrap}
.basis-list{display:grid;gap:7px}
.basis{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-inset);font-size:11px;line-height:1.6}
.basis code{font-family:var(--font-mono);font-size:10.3px;color:var(--accent-solid);white-space:nowrap}
.proposals{display:grid;gap:8px;counter-reset:p}
.proposal{display:flex;gap:10px;padding:10px 11px;border:1px solid var(--line);border-left:3px solid var(--accent-solid);border-radius:9px;background:var(--surface-inset);font-size:11.5px;line-height:1.65}
.proposal::before{counter-increment:p;content:counter(p);flex:none;width:19px;height:19px;display:grid;place-items:center;border-radius:50%;background:var(--accent-soft);color:var(--accent-solid);font-size:10px;font-weight:700}
.proposal b{display:block;font-size:11.5px}
.proposal span{color:var(--muted)}

/* ═══ 交互绑定 ═══ */
const HINTS={library:'提词库 · 三栏（分类列表 / 参数 / 结果）',labeler:'打标器 · 批次 / 设置 / 结果',comfyui:'造梦机 · 4.1.1 新增第四档「批量生成」',novel:'拆书匠 · 五阶段 + 三栏',writer:'织书台 · 四阶段 + 草稿保护',spec:'色板 / 令牌 / 断点 / 依据 / 提案清单'};
function renderPage(){
  const p=document.body.dataset.page;
  document.getElementById('wsBody').innerHTML=PAGES_HTML[p]();
  const pg=PAGES.find(x=>x.id===p);
  document.getElementById('wsSub').textContent=pg.sub;
  document.getElementById('pvHint').textContent=HINTS[p];
  document.querySelectorAll('#railNav .rail-item').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  if(p==='comfyui'){
    document.getElementById('comfyTabs').addEventListener('click',e=>{
      const b=e.target.closest('[data-p]');if(!b)return;
      document.querySelectorAll('#comfyTabs .tab').forEach(x=>x.classList.toggle('on',x===b));
      const isBatch=b.dataset.p==='batch';
      document.getElementById('comfyBatch').hidden=!isBatch;
      document.getElementById('comfyRun').hidden=isBatch;
    });
  }
  /* 手机端三档切换：只滚动到对应列，不改动任何数据 */
  document.querySelectorAll('#wsBody .mob-tabs').forEach(bar=>{
    bar.querySelectorAll('span').forEach((sp,i)=>sp.addEventListener('click',()=>{
      bar.querySelectorAll('span').forEach(x=>x.classList.toggle('on',x===sp));
      const cols=document.querySelector('#wsBody .ws-cols');
      const target=cols&&cols.children[i];
      if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
    }));
  });
}
function renderRail(){
  document.getElementById('railNav').innerHTML=PAGES.map(p=>`<button class="rail-item${p.id===document.body.dataset.page?' on':''}" data-p="${p.id}">${ic(p.icon)}<span>${p.name}</span><em>${p.count}</em></button>`).join('');
  document.querySelectorAll('#railNav .rail-item').forEach(b=>b.addEventListener('click',()=>{document.body.dataset.page=b.dataset.p;renderPage();renderRail()}));
}
function renderSegPage(){
  const m=document.body.dataset.module;
  const items=m==='studio'?PAGES.map(p=>[p.id,p.name]):m==='agent'?[['active','进行中'],['waiting','等待确认'],['completed','已完成'],['dialogs','弹窗']]:[['spec','规范总览']];
  document.getElementById('segPage').innerHTML=items.map((i,k)=>`<button data-v="${i[0]}" class="${k===0?'on':''}">${i[1]}</button>`).join('');
  document.querySelectorAll('#segPage button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#segPage button').forEach(x=>x.classList.toggle('on',x===b));
    const v=b.dataset.v;
    if(m==='studio'){document.body.dataset.page=v;renderPage();renderRail()}
    else if(m==='agent'){
      if(v==='dialogs'){openDlg('launch');return}
      const map={active:1,waiting:2,completed:4};
      document.body.dataset.sa=map[v];renderAgent();
    }
  }));
}
function setModule(m){
  document.body.dataset.module=m;
  document.querySelectorAll('#segModule button').forEach(b=>b.classList.toggle('on',b.dataset.v===m));
  ['studio','agent','spec'].forEach(x=>document.getElementById('scene'+x[0].toUpperCase()+x.slice(1)).classList.toggle('on',x===m));
  document.getElementById('pvHint').textContent=m==='spec'?HINTS.spec:m==='agent'?'任务总管 · 三栏 / 五类内容区':HINTS[document.body.dataset.page];
  renderSegPage();
  if(m==='agent')renderAgent();
  if(m==='spec')renderSpec();
  if(m==='studio'){renderPage();renderRail()}
}
function bindDynamic(){
  document.querySelectorAll('#saList [data-task]').forEach(b=>b.addEventListener('click',()=>{document.body.dataset.sa=b.dataset.task;renderAgent()}));
  const zt=document.getElementById('zoneTabs');
  if(zt)zt.addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;
    zt.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
    document.getElementById('zoneHost').innerHTML=zoneHtml(b.dataset.z)});
}
function bindBar(){
  const wire=(id,apply)=>document.querySelectorAll('#'+id+' button').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));apply(b.dataset.v)}));
  wire('segTheme',v=>document.documentElement.dataset.theme=v);
  wire('segSkin',v=>document.documentElement.dataset.skin=v);
  wire('segVp',v=>document.body.dataset.vp=v);
  wire('segTone',v=>document.body.dataset.tone=v);
  wire('segModule',v=>setModule(v));
  document.getElementById('btnLaunch').addEventListener('click',()=>openDlg('launch'));
  document.getElementById('btnResult').addEventListener('click',()=>openDlg('result'));
  document.getElementById('btnRefresh').addEventListener('click',()=>{const s=document.getElementById('saSync');s.textContent='● 已同步 · 刚刚'});
  document.getElementById('saFilters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;
    document.querySelectorAll('#saFilters button').forEach(x=>x.classList.toggle('on',x===b));
    const f=b.dataset.f,map={waiting:'waiting',completed:'completed',archived:'archived'};
    const list=map[f]?TASKS.filter(t=>t.status===map[f]):TASKS;
    const sel=+document.body.dataset.sa;
    document.getElementById('saList').innerHTML=list.map(x=>taskRow(x,x.id===sel)).join('');
    bindDynamic();
  });
  document.getElementById('mask').addEventListener('click',e=>{
    if(e.target.id==='mask'||e.target.closest('[data-close]'))closeDlg();
    const o=e.target.closest('[data-open]');if(o)openDlg(o.dataset.open);
  });
}
bindBar();renderRail();renderPage();renderSegPage();
</script>
