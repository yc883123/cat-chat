<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>任务总管 · 六类任务内容区预览</title>
<!--
  设计层提案：不连接真实任务、不调用模型、不写入数据、不修改任何产品代码。
  截图依据（2026-11-04 本人提供）：任务类型下拉 6 项 ——
    织书台·原创写作 / 拆书匠·小说改编 / 批量制作视频 / 聊天任务 /
    关联已有后台任务 / 交给子助手
  真实代码依据：
    public/index.html:1837, 1840-1876  任务类型与各类型专属表单字段
    public/js/28-super-agent.js:35-36  CHAINS / SINGLE_STAGES
    public/js/28-super-agent.js:186-226  supervision 轮次、完成标准、审查结论
    public/js/28-super-agent.js:373-391  通用步骤节点
    public/js/28-super-agent.js:1595-1603  批次组卡（逐组 included / prompt / media）
    public/js/28-super-agent.js:253-258  子助手待确认（tool / reason / scope / action_source / 脱敏参数）
    naiba/super_agent/domain.py:13-17, 48-57  WRITER_CHAIN 4 阶段；NOVEL_CHAIN 5 阶段，
      import / review 是 coordination gates（不调用 NovelService）
  沿用 public/styles.css 现有 :root 令牌名，不另起色板。
  任务名、章数、组数、子助手名均为代表性示意；缩略图全部为 CSS 占位，未使用真实产物图。
-->
<style>
:root{
  color-scheme:light;
  --brand-100:#EDECFF; --brand-200:#DCD3FF; --brand-500:#7C5CFF; --brand-600:#6D5AE6; --brand-700:#5A47C4;
  --neutral-0:#fff; --neutral-50:#F8F9FC; --neutral-100:#F1F2F7; --neutral-200:#E6E8F0; --neutral-300:#D2D6E3;
  --neutral-400:#A9AFC2; --neutral-500:#7A8099; --neutral-600:#5A6079; --neutral-700:#3D4257; --neutral-800:#2A2E40; --neutral-900:#1E2138;
  --bg:#F6F7FB; --surface:var(--neutral-0); --surface-2:var(--neutral-100); --surface-inset:#F5F6FA;
  --line:var(--neutral-200); --line-strong:var(--neutral-300);
  --text:var(--neutral-800); --muted:var(--neutral-500);
  --accent:var(--brand-500); --accent-solid:var(--brand-600); --accent-soft:var(--brand-100);
  --sidebar:#1E2138; --sidebar-line:#31354E; --sidebar-hover:#2A2E49; --sidebar-text:#F1F2F7; --sidebar-muted:#989FC0;
  --success:#12A594; --success-soft:#DCF4F0; --warning:#D9820B; --warning-soft:#FCF0E0;
  --danger:#DC4A46; --danger-soft:#FCE8E7; --info:#3B82C4; --info-soft:#E6F1FB;
  --r-sm:6px; --r-md:9px; --r-lg:13px; --r-xl:18px; --r-full:999px;
  --shadow-1:0 1px 2px rgba(30,33,56,.05),0 1px 3px rgba(30,33,56,.04);
  --shadow-2:0 6px 20px rgba(30,33,56,.09),0 2px 6px rgba(30,33,56,.045);
  --shadow-3:0 18px 48px rgba(30,33,56,.20),0 4px 12px rgba(30,33,56,.08);
  --font-sans:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --neutral-0:#171A24; --neutral-50:#111522; --neutral-100:#1D2130; --neutral-200:#2B3143; --neutral-300:#3D455C;
  --neutral-400:#66708A; --neutral-500:#8D96AD; --neutral-600:#AEB6C8; --neutral-700:#C8CEDA; --neutral-800:#E3E7EF; --neutral-900:#0D1019;
  --bg:#111522; --surface:#171A24; --surface-2:#1D2130; --surface-inset:#121620;
  --line:#2B3143; --line-strong:#3D455C; --text:#E3E7EF; --muted:#8D96AD;
  --accent-soft:#2A2350; --sidebar:#0D1019; --sidebar-line:#282D40; --sidebar-hover:#1D2130; --sidebar-text:#E3E7EF; --sidebar-muted:#9CA6BD;
  --success-soft:#163C3B; --warning-soft:#46351A; --danger-soft:#452322; --info-soft:#183044;
  --shadow-1:0 1px 2px rgba(0,0,0,.25); --shadow-2:0 6px 20px rgba(0,0,0,.3); --shadow-3:0 18px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.6 var(--font-sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}

/* ── 预览工具条 ── */
.preview-bar{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:40}
.preview-kicker{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;white-space:nowrap}
.preview-kicker i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.preview-note{color:var(--muted);font-size:11.5px;white-space:nowrap}
.scene-tabs{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.scene-tabs::-webkit-scrollbar{display:none}
.scene-tab{border:0;border-radius:6px;padding:5px 10px;background:transparent;color:var(--muted);font-size:12px;white-space:nowrap}
.scene-tab:hover{color:var(--text)}
.scene-tab.active{background:var(--surface);color:var(--accent-solid);font-weight:650;box-shadow:var(--shadow-1)}
.preview-spacer{flex:1}
.demo-control{height:31px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--muted);padding:0 10px;font-size:12px;white-space:nowrap;flex:none}
.demo-control:hover{border-color:var(--accent);color:var(--text)}
.demo-control.active{color:var(--accent-solid);border-color:var(--accent);background:var(--accent-soft)}
.demo-control svg{width:15px;height:15px}

/* ── 类型下拉：按本人截图还原（自定义组件，非原生 select） ── */
.type-picker{position:relative;flex:none;z-index:45}
.type-current{display:flex;align-items:center;justify-content:space-between;gap:14px;min-width:196px;min-height:34px;padding:0 11px;border:1.5px solid #8b6cff;border-radius:10px;background:#221f3a;color:#F1F2F7;font-size:12.5px;font-weight:600;text-align:left;box-shadow:0 0 0 3px rgba(124,92,255,.12)}
.type-current:hover{background:#2a2547}
.type-current svg{width:15px;height:15px;color:#b9a8ff;transition:transform .16s}
.type-picker.open .type-current svg{transform:rotate(90deg)}
.type-menu{position:absolute;left:0;top:calc(100% + 5px);min-width:222px;padding:5px;border:1px solid #4b4270;border-radius:9px;background:#1c1a2e;box-shadow:0 14px 34px rgba(0,0,0,.42);display:grid;gap:2px;z-index:50}
.type-menu button{display:block;width:100%;padding:7px 11px;border:0;border-radius:5px;background:transparent;color:#E7E6F5;font-size:12.5px;text-align:left;white-space:nowrap}
.type-menu button:hover{background:#2f6fed;color:#fff}
.type-menu button.selected{background:#2f6fed;color:#fff}

/* ── 舞台 · 仿真三栏 ── */
.stage{position:fixed;inset:54px 0 0;background:var(--bg);overflow:hidden}
.sim{display:grid;grid-template-columns:262px minmax(0,1fr) 322px;grid-template-rows:58px minmax(0,1fr);height:100%;min-height:0}
.sim-sidebar{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;min-height:0;background:var(--sidebar);color:var(--sidebar-text);border-right:1px solid var(--sidebar-line)}
.brand{display:flex;align-items:center;gap:11px;padding:18px 16px 14px}
.brand-mark{width:32px;height:32px;display:grid;place-items:center;border:1px solid #a28dff;border-radius:10px;background:linear-gradient(145deg,#a78bfa,#7254e5);color:#fff;font-size:17px;font-weight:700;box-shadow:0 3px 14px #7c5cff55}
.brand-copy{display:grid;gap:2px}.brand-copy strong{font-size:15px}.brand-copy small{color:var(--sidebar-muted);font-size:11px}
.app-nav{display:flex;gap:3px;margin:0 12px;padding:3px;border-radius:var(--r-md);background:var(--sidebar-hover)}
.app-nav button{flex:1;border:0;border-radius:var(--r-sm);padding:6px 4px;background:transparent;color:var(--sidebar-muted);font-size:12px}
.app-nav button[aria-current="page"]{background:#7c5cff44;color:#fff;font-weight:600}
.btn-new{display:flex;align-items:center;gap:8px;margin:14px 12px 10px;min-height:40px;padding:8px 12px;border:1px solid rgba(155,130,255,.5);border-radius:var(--r-md);background:rgba(124,92,255,.18);color:var(--sidebar-text);font-size:13px;font-weight:600}
.btn-new:hover{background:rgba(124,92,255,.3)}
.panel-head{display:flex;justify-content:space-between;padding:8px 18px;color:var(--sidebar-muted);font-size:11px}
.filters{display:flex;gap:5px;padding:0 12px 6px}.filters button{border:0;border-radius:var(--r-sm);padding:5px 7px;background:transparent;color:var(--sidebar-muted);font-size:11px}
.filters button[aria-pressed="true"]{background:var(--sidebar-hover);color:var(--sidebar-text)}
.thread-list{display:flex;flex-direction:column;gap:6px;padding:4px 10px;overflow:auto;min-height:0;flex:1}
.thread{display:grid;gap:3px;padding:10px;border:1px solid transparent;border-radius:var(--r-md);color:var(--sidebar-text);text-align:left}
.thread:hover{background:var(--sidebar-hover)}
.thread.active{border-color:#a28dff66;background:#7c5cff33}
.thread strong{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread small{color:var(--sidebar-muted);font-size:11px;padding-left:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-ico{width:19px;height:19px;display:grid;place-items:center;border-radius:5px;background:#ffffff0a;color:var(--sidebar-muted);font-size:12px;font-style:normal}
.list-note{margin:auto 0 0;padding:14px 18px;border-top:1px solid var(--sidebar-line);color:var(--sidebar-muted);font-size:11px}
.sim-topbar{grid-column:2/4;grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.sim-topbar strong{color:var(--text);font-weight:600}
.sim-main{grid-column:2;grid-row:2;min-width:0;min-height:0;overflow:auto;padding:18px;background:color-mix(in srgb,var(--accent-soft) 22%,var(--surface))}
.sim-aside{grid-column:3;grid-row:2;min-width:0;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start;padding:14px;background:var(--surface-inset);border-left:1px solid var(--line)}
.aside-card{padding:13px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.aside-card h3{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.aside-ref{font-size:12px}.aside-ref p{margin-top:5px;color:var(--muted);font-size:11.5px;line-height:1.6}
.aside-link{display:flex;width:100%;padding:7px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font-size:12px;text-align:left;justify-content:space-between}
.aside-link:last-child{border-bottom:0}.aside-link:hover{color:var(--accent-solid)}.aside-link em{font-style:normal;color:var(--muted);font-size:11px}

/* ── 统一外壳 ── */
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.04em}
.detail-head h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:4px 0 3px}
.detail-head p{color:var(--muted);font-size:12px;line-height:1.55}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:var(--r-full);font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.run{background:var(--accent-soft);color:var(--accent-solid)}
.pill.ok{background:var(--success-soft);color:var(--success)}
.pill.wait{background:var(--warning-soft);color:var(--warning)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.idle{background:var(--surface-2);color:var(--muted)}
.detail-actions{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.mini-btn{min-height:30px;padding:0 11px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-size:11.5px}
.mini-btn:hover{border-color:var(--accent);color:var(--accent-solid)}
.mini-btn:disabled{opacity:.45;cursor:not-allowed}
.mini-btn.primary{border-color:var(--accent-solid);background:var(--accent-solid);color:#fff}
.control-note{color:var(--muted);font-size:11px;margin:0 0 14px;line-height:1.55}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{padding:12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.metric h3{font-size:11px;color:var(--muted);font-weight:600}
.metric strong{display:block;margin-top:5px;font-size:16px;font-weight:700}
.metric small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.5}
.timeline{margin-top:16px}
.tl-row{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.tl-row:last-child{border-bottom:0}.tl-row time{color:var(--muted);font-size:10.5px;white-space:nowrap}.tl-row b{font-weight:600}.tl-row span{color:var(--muted)}
.sec{margin-bottom:0;padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.sec + .sec{margin-top:12px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.sec-head h2{font-size:13px;font-weight:700}
.sec-head span{color:var(--muted);font-size:11px}
.hint{color:var(--muted);font-size:11.5px;line-height:1.65}
.zone-tag{display:inline-flex;align-items:center;gap:6px;margin-bottom:9px;padding:2px 9px;border:1px dashed var(--accent);border-radius:var(--r-full);color:var(--accent-solid);font-size:10.5px;font-weight:600;background:var(--accent-soft)}
.zone-tag i{width:6px;height:6px;border-radius:50%;background:var(--accent-solid);font-style:normal}
.content-zone{position:relative;border-radius:var(--r-lg)}
body.zone-only .shell-piece{opacity:.32;filter:grayscale(.7)}
body.zone-only .content-zone{outline:2px solid var(--accent);outline-offset:5px}
body.zone-only .content-zone::after{content:"内容区 · 随任务类型替换";position:absolute;right:0;top:-11px;padding:2px 9px;border-radius:var(--r-full);background:var(--accent-solid);color:#fff;font-size:10px;font-weight:600;transform:translateY(-100%)}

/* ── 通用小组件 ── */
.kv-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.kv{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r-full);background:var(--surface);font-size:11.5px;color:var(--muted)}
.kv b{color:var(--text);font-weight:700}
.row-list{display:grid;gap:7px}
.row-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px}
.row-item b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item em{font-style:normal;color:var(--muted);font-size:10.5px}
.callout{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--info) 40%,var(--line));border-radius:var(--r-md);background:var(--info-soft);font-size:11.5px;line-height:1.6;margin-bottom:12px}
.callout svg{width:16px;height:16px;color:var(--info);margin-top:2px;flex:none}
.callout.warn{border-color:color-mix(in srgb,var(--warning) 40%,var(--line));background:var(--warning-soft)}
.callout.warn svg{color:var(--warning)}
.callout.ok{border-color:color-mix(in srgb,var(--success) 40%,var(--line));background:var(--success-soft)}
.callout.ok svg{color:var(--success)}
.tag{display:inline-block;padding:1px 7px;border-radius:var(--r-full);background:var(--surface-2);color:var(--muted);font-size:10.5px;font-weight:600}
.tag.ok{background:var(--success-soft);color:var(--success)}
.tag.warn{background:var(--warning-soft);color:var(--warning)}
.tag.gate{background:var(--info-soft);color:var(--info)}

/* 阶段轨道（写作 / 改编共用，但节点语义不同） */
.stage-track{display:grid;gap:0;margin-bottom:14px}
.track-node{position:relative;padding:0 8px 0 0;min-width:0}
.track-node .dot{position:relative;z-index:2;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--line-strong);border-radius:50%;background:var(--surface);color:var(--muted);font-size:11px;font-weight:700}
.track-node .line{position:absolute;left:26px;top:13px;right:0;height:1.5px;background:var(--line-strong)}
.track-node:last-child .line{display:none}
.track-node.done .dot{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.track-node.done .line{background:var(--success)}
.track-node.current .dot{border-color:var(--accent-solid);background:var(--accent-solid);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.track-node.gate .dot{border-style:dashed;border-color:var(--info);color:var(--info);background:var(--info-soft);font-size:10px}
.track-node b{display:block;margin-top:8px;font-size:12px;font-weight:650}
.track-node small{display:block;color:var(--muted);font-size:10.5px;line-height:1.5}
.track-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.track-5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* 1 织书台 */
.volume-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.volume{min-width:132px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px}
.volume.active{border-color:var(--accent);background:var(--accent-soft)}
.volume b{display:block;font-weight:650}.volume small{color:var(--muted);font-size:10.5px}
.chapter-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.chapter{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:var(--surface-inset);font-size:10px;color:var(--muted)}
.chapter.done{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 35%,var(--line));color:var(--success);font-weight:700}
.chapter.current{background:var(--accent-soft);border-color:var(--accent-solid);color:var(--accent-solid);font-weight:700}
.chapter.pending{opacity:.55}

/* 2 拆书匠 */
.range-bar{display:flex;align-items:center;gap:10px;padding:9px 11px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px;flex-wrap:wrap}
.range-bar b{font-weight:650}.range-bar .bar{flex:1;min-width:90px;height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.range-bar .bar i{display:block;width:46%;height:100%;background:var(--accent-solid)}
.element-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
.element{padding:10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset)}
.element b{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650}
.element b svg{width:14px;height:14px;color:var(--accent-solid)}
.element p{margin-top:5px;color:var(--muted);font-size:10.5px;line-height:1.55}
.element strong{display:block;margin-top:6px;font-size:15px;font-weight:700}
.scene-list{display:grid;gap:7px}
.scene{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px}
.scene > span:first-child{color:var(--muted);font-size:10.5px}
.scene b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gate-card{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:11px;border:1px dashed var(--info);border-radius:var(--r-md);background:var(--info-soft)}
.gate-card svg{width:17px;height:17px;color:var(--info);flex:none;margin-top:2px}
.gate-card div{flex:1;min-width:0}.gate-card b{font-size:12px;font-weight:650}.gate-card p{margin-top:3px;color:var(--muted);font-size:11px;line-height:1.6}
.gate-card .acts{display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}

/* 3 批量视频 */
.batch-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.batch{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.batch-media{position:relative;aspect-ratio:16/10;display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:10px;text-align:center;background:linear-gradient(135deg,#2C3350,#4A4270)}
.batch-media.b2{background:linear-gradient(135deg,#3D3152,#6B4A72)}
.batch-media.b3{background:linear-gradient(135deg,#26405A,#3C6B78)}
.batch-media.b4{background:linear-gradient(135deg,#3A3F4B,#5B6070)}
.batch-media .ph{display:grid;place-items:center;gap:4px}
.batch-media .ph svg{width:18px;height:18px;opacity:.85}
.batch-tag{position:absolute;left:7px;top:7px;padding:2px 7px;border-radius:var(--r-full);background:rgba(0,0,0,.45);color:#fff;font-size:10px}
.batch-body{padding:9px 10px}
.batch-body b{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:650;align-items:center}
.batch-body p{margin-top:4px;color:var(--muted);font-size:10.5px;line-height:1.5;height:32px;overflow:hidden}
.batch-body .media-line{display:flex;align-items:center;gap:5px;margin-top:6px;color:var(--muted);font-size:10px}
.batch-body .media-line svg{width:12px;height:12px}
.check-list{display:grid;gap:7px;margin-top:12px}
.check{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.check i{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--success-soft);color:var(--success);font-size:11px;font-weight:700;font-style:normal;flex:none}
.check.warn i{background:var(--warning-soft);color:var(--warning)}
.check b{color:var(--text);font-weight:600}
.group-actions{display:flex;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap}

/* 4 聊天任务 */
.goal-card{padding:11px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:12px;line-height:1.7}
.goal-card small{display:block;margin-bottom:5px;color:var(--muted);font-size:10.5px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.mode-card{padding:11px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-inset);text-align:left}
.mode-card.active{border-color:var(--accent);background:var(--accent-soft)}
.mode-card b{font-size:12px;font-weight:650}.mode-card p{margin-top:4px;color:var(--muted);font-size:10.5px;line-height:1.55}
.round{display:grid;grid-template-columns:66px minmax(0,1fr);gap:12px;padding-bottom:12px;border-left:1.5px solid var(--line-strong);margin-left:14px;position:relative}
.round:last-child{border-left-color:transparent;padding-bottom:0}
.round .badge{position:absolute;left:-14px;top:0;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-strong);color:var(--muted);font-size:10px;font-weight:700}
.round.done .badge{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.round.active .badge{border-color:var(--accent-solid);background:var(--accent-soft);color:var(--accent-solid)}
.round-label{padding-top:4px;color:var(--muted);font-size:11px;font-weight:600}
.round-body{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-inset)}
.round-body b{font-size:11.5px;font-weight:650}.round-body p{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.6}
.criteria{display:grid;gap:7px;margin-top:12px}
.crit{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px}
.crit i{font-style:normal;color:var(--success);font-weight:700;flex:none}
.crit.wait i{color:var(--warning)}.crit.opinion i{color:var(--info)}
.crit small{color:var(--muted);font-size:10.5px}

/* 5 后台任务（只读镜像） */
.mirror-banner{display:flex;align-items:flex-start;gap:9px;padding:11px 12px;margin-bottom:12px;border:1px solid color-mix(in srgb,var(--warning) 45%,var(--line));border-radius:var(--r-md);background:var(--warning-soft);font-size:11.5px;line-height:1.65}
.mirror-banner svg{width:17px;height:17px;color:var(--warning);flex:none;margin-top:2px}
.source-card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-inset);margin-bottom:12px}
.source-ico{width:44px;height:44px;display:grid;place-items:center;border-radius:11px;background:var(--accent-soft);color:var(--accent-solid)}
.source-ico svg{width:22px;height:22px}
.source-card b{font-size:13px;font-weight:650}.source-card p{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.6}
.source-progress{width:100%;height:6px;margin-top:9px;border-radius:4px;background:var(--line);overflow:hidden}
.source-progress i{display:block;width:68%;height:100%;background:var(--accent-solid)}
.status-rows{display:grid;gap:7px}
.status-row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px}
.status-row span{color:var(--muted);font-size:10.5px}.status-row b{font-weight:600}
.readonly-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}

/* 6 子助手 */
.instruction{padding:11px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:12px;line-height:1.7}
.instruction small{display:block;margin-bottom:5px;color:var(--muted);font-size:10.5px}
.delegate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:12px}
.delegate{padding:11px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-inset)}
.delegate-top{display:flex;align-items:center;gap:8px}
.delegate-ico{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--accent-soft);color:var(--accent-solid)}
.delegate-ico svg{width:15px;height:15px}
.delegate b{font-size:11.5px;font-weight:650}
.delegate p{margin-top:7px;color:var(--muted);font-size:10.5px;line-height:1.6;min-height:32px}
.delegate .dfoot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px}
.approval{padding:12px;border:1px solid color-mix(in srgb,var(--warning) 45%,var(--line));border-radius:var(--r-lg);background:var(--warning-soft)}
.approval b{font-size:12px;font-weight:650}
.approval p{margin-top:5px;color:var(--muted);font-size:11px;line-height:1.6}
.approval .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.param-mask{margin-top:8px;padding:8px 10px;border:1px dashed var(--line-strong);border-radius:var(--r-md);background:var(--surface);font-size:10.5px;color:var(--muted)}
.approval .acts{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}

/* ── 并排对照 / 说明 ── */
.wide{position:fixed;inset:54px 0 0;overflow:auto;padding:22px;background:var(--bg)}
.wide-inner{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.wide h1{font-size:18px;font-weight:700}.wide h2{font-size:14px;font-weight:700;margin-bottom:10px}
.wide p{font-size:12.5px;line-height:1.75;color:var(--muted)}
.panel{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-1)}
.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.gallery-card{padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-inset);cursor:pointer;text-align:left}
.gallery-card:hover{border-color:var(--accent);box-shadow:var(--shadow-2)}
.gc-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.gc-head b{font-size:12.5px;font-weight:700}.gc-head .tag{margin-left:auto}
.gc-sub{color:var(--muted);font-size:11px;margin-bottom:10px;line-height:1.6}
.mini-zone{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);min-height:96px}
.mini-row{display:flex;gap:5px;align-items:center}
.mini-box{height:12px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line)}
.mini-box.a{background:var(--accent-soft);border-color:var(--accent)}
.mini-box.b{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 35%,var(--line))}
.mini-box.c{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 35%,var(--line))}
.mini-grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:3px}
.mini-grid i{aspect-ratio:1;border-radius:2px;background:var(--surface-2);border:1px solid var(--line);font-style:normal}
.mini-grid i.on{background:var(--success-soft);border-color:var(--success)}
.mini-cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.mini-cards i{height:26px;border-radius:3px;background:linear-gradient(135deg,#2C3350,#4A4270);font-style:normal}
.mini-line{height:9px;border-radius:4px;background:var(--surface-2)}
.gc-foot{margin-top:9px;color:var(--accent-solid);font-size:11px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.6}
th{color:var(--muted);font-weight:600;font-size:11px;background:var(--surface-inset)}
td b{font-weight:650}
.panel ul{margin:0;padding-left:18px;font-size:12px;line-height:1.9;color:var(--muted)}
.panel ul b{color:var(--text)}
.selfcheck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sc{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px}
.sc i{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--success-soft);color:var(--success);font-size:11px;font-style:normal;font-weight:700;flex:none}
.sc.bad i{background:var(--danger-soft);color:var(--danger)}
.sc span{color:var(--muted)}.sc b{color:var(--text);font-weight:650}

/* ── 尺寸标注 ── */
body.show-measure [data-m]{position:relative;outline:1px dashed var(--accent)}
body.show-measure [data-m]::after{content:attr(data-m-size);position:absolute;right:0;top:0;z-index:12;padding:1px 5px;border-radius:4px;background:var(--accent-solid);color:#fff;font-size:9.5px;line-height:1.5;white-space:nowrap;pointer-events:none}

/* ── 手机视图 / 窄屏 ── */
body[data-mobile="true"] .sim{grid-template-columns:minmax(0,1fr);grid-template-rows:58px minmax(0,1fr)}
body[data-mobile="true"] .sim-sidebar,body[data-mobile="true"] .sim-aside{display:none}
body[data-mobile="true"] .sim-topbar{grid-column:1;grid-row:1;padding:0 14px}
body[data-mobile="true"] .sim-main{grid-column:1;grid-row:2;padding:14px}
body[data-mobile="true"] .metrics{grid-template-columns:1fr 1fr}
body[data-mobile="true"] .batch-grid,body[data-mobile="true"] .element-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
body[data-mobile="true"] .delegate-grid{grid-template-columns:1fr}
body[data-mobile="true"] .track-4,body[data-mobile="true"] .track-5{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 0}
body[data-mobile="true"] .chapter-grid{grid-template-columns:repeat(8,minmax(0,1fr))}
body[data-mobile="true"] .gallery-grid,body[data-mobile="true"] .selfcheck{grid-template-columns:1fr}
body[data-mobile="true"] .measure-samples{grid-template-columns:1fr!important}
body[data-mobile="true"] .wide{padding:14px}
body[data-mobile="true"] .preview-note{display:none}
@media(max-width:1100px){.preview-note{display:none}.scene-tab{padding:5px 8px}}
@media(max-width:900px){.gallery-grid,body .selfcheck{grid-template-columns:1fr}}
@media(max-width:640px){
  .preview-bar{gap:6px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
  .preview-bar::-webkit-scrollbar{display:none}
  .preview-kicker{flex:none}.preview-kicker span{display:none}
  .preview-spacer{display:none}
  .demo-control{padding:0 7px;flex:none}.demo-control span{display:none}
  .type-current{min-width:150px}
  .panel{overflow-x:auto}
}

.toast{position:fixed;left:50%;bottom:22px;z-index:90;transform:translate(-50%,8px);padding:9px 16px;border-radius:var(--r-full);background:var(--neutral-800);color:#fff;font-size:12px;box-shadow:var(--shadow-3);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], el=id=>document.getElementById(id);
const I={
  chev:'<svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"></path></svg>',
  book:'<svg viewBox="0 0 24 24"><path d="M5 4h9a3 3 0 0 1 3 3v13H8a3 3 0 0 0-3 3z"></path><path d="M5 4v18M8 9h6"></path></svg>',

function toast(msg){const t=el('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2000)}

/* ══════════ 六种内容区 ══════════ */

/* 1 织书台 · 原创写作：阶段链 + 部 + 章节网格 + 按章产物 */
function bodyWriter(){
  const stages=[['设定','已完成','done'],['大纲','已完成','done'],['拆章','进行中','current'],['正文','等待前序','']];
  return `<section class="sec" data-m="zone-writer">
    <span class="zone-tag"><i></i>内容区 A · 章节链</span>
    ${secHead('创作阶段','4 个真实步骤 · 线性推进')}
    <div class="stage-track track-4">${stages.map(([n,s,c],i)=>`<div class="track-node ${c}"><span class="dot">${c==='done'?'✓':i+1}</span><i class="line"></i><b>${n}</b><small>${s}</small></div>`).join('')}</div>
    ${secHead('分部','最多 20 部 · 当前第 1 部')}
    <div class="volume-strip"><div class="volume active"><b>第一部 · 起点</b><small>20 章 · 已写 12</small></div><div class="volume"><b>第二部 · 转折</b><small>待开始</small></div><div class="volume"><b>第三部 · 收束</b><small>待开始</small></div></div>
    <div class="range-bar"><b>拆章范围</b><span>第 1 部 · 第 1–20 章</span><span class="bar"><i></i></span><span class="tag">12 / 20 章</span></div>
    ${secHead('第 1 部 · 章节进度','点章节看对应正文')}
    <div class="chapter-grid">${Array.from({length:20},(_,i)=>`<span class="chapter ${i<12?'done':i===12?'current':'pending'}">${i+1}</span>`).join('')}</div>
    <div class="row-list" style="margin-top:11px"><div class="row-item"><b>第 12 章 · 雨夜</b><em>3 分钟前</em>${pill('已保存','ok')}</div><div class="row-item"><b>第 11 章 · 旧书房</b><em>26 分钟前</em>${pill('已保存','ok')}</div><div class="row-item"><b>第一部分 · 大纲</b><em>1 小时前</em>${pill('已保存','ok')}</div></div>

        <button class="mini-btn" data-act="暂停任务" ${t.readonly?'disabled':''}>暂停任务</button>
        <button class="mini-btn" data-act="继续任务" ${t.readonly?'disabled':''}>继续任务</button>
        <button class="mini-btn" data-act="取消任务" ${t.readonly?'disabled':''}>取消任务</button>
        ${t.readonly?'<span class="hint" style="margin-left:4px">只读镜像：这三个操作不由总管提供</span>':''}
      </div>
      <p class="control-note shell-piece">${t.readonly?'这里只读取源任务的真实状态；不会重新启动或改写它。':'暂停只停止后续步骤；正在执行的步骤仍可能完成。'}</p>
      <div class="metrics shell-piece">${t.metrics.map(([h,v,s])=>`<div class="metric"><h3>${h}</h3><strong>${v}</strong><small>${s}</small></div>`).join('')}</div>
      <div class="content-zone" id="contentZone" data-m="content-zone">${t.body()}</div>
      <div class="sec timeline shell-piece">${secHead('时间线','最近活动在前 · 所有类型共用')}
        <div class="tl-row"><time>2 分钟前</time><span><b>${t.next}</b> · 状态已更新</span></div>
        <div class="tl-row"><time>26 分钟前</time><span>新产物已保存</span></div>
        <div class="tl-row"><time>1 小时前</time><span>任务已创建</span></div></div>
    </section>
    ${asideHtml(t)}
  </div>`;
}

/* ══════════ 并排对照 ══════════ */
function miniZone(kind){
  const box=(w,c)=>`<i class="mini-box ${c||''}" style="width:${w}"></i>`;
  const row=(...items)=>`<div class="mini-row">${items.join('')}</div>`;
  const line=(w)=>`<div class="mini-line" style="width:${w}"></div>`;
  if(kind==='track+chapter')return row(box('22%','a'),box('22%','b'),box('22%','b'),box('22%'))+`<div class="mini-grid" style="margin-top:6px">${Array.from({length:16},(_,i)=>`<i class="${i<10?'on':''}"></i>`).join('')}</div>`+line('72%');
  if(kind==='track+element')return row(box('18%','a'),box('18%','b'),box('18%','b'),box('18%','a'),box('18%'))+row(box('23%'),box('23%'),box('23%'),box('23%'))+line('86%')+line('64%');
  if(kind==='cards')return `<div class="mini-cards">${Array.from({length:8},()=>'<i></i>').join('')}</div>`+row(box('30%','a'),box('30%','b'),box('30%','c'));
  if(kind==='rounds')return row(box('14%','b'),box('70%'))+row(box('14%','a'),box('70%'))+row(box('14%'),box('55%'))+line('80%');
  if(kind==='mirror')return row(box('100%','c'))+row(box('16%','a'),box('78%'))+line('90%')+line('70%')+line('80%');
  return row(box('30%','b'),box('30%','b'),box('30%','a'))+row(box('100%','c'))+line('86%')+line('62%');
}
function galleryHtml(){
  return `<div class="wide"><div class="wide-inner">
    <div class="panel"><h1>六类任务 · 内容区并排</h1><p>下面每块缩略图对应一种内容区的真实结构；点卡片进「单任务详情」看完整版本。外壳（标题 / 状态 / 操作 / 指标 / 时间线 / 右栏）六类完全一致，没有整页换皮。</p></div>
    <div class="gallery-grid">${ORDER.map(k=>{const t=TYPES[k];return `<button class="gallery-card" data-goto="${k}" type="button">
      <div class="gc-head"><b>${t.label}</b><span class="tag">${t.short}</span></div><div class="gc-sub">${t.summary}</div>
      <div class="mini-zone" data-m="mini-${k}">${miniZone(t.mini)}</div><div class="gc-foot">查看完整内容区 ›</div></button>`}).join('')}</div>
    <div class="panel"><h2>它们其实只有 3 种「芯」 + 1 个只读态</h2>
      <table><thead><tr><th style="width:120px">芯</th><th>覆盖类型</th><th>为什么归在一起</th></tr></thead><tbody>
        <tr><td><b>链 chain</b></td><td>织书台 · 原创写作 / 拆书匠 · 小说改编</td><td>都是线性阶段推进，但产物不同（章 vs 场次）；拆书匠多两个关卡</td></tr>
        <tr><td><b>批 batch</b></td><td>批量制作视频</td><td>单位是「组」，可逐组确认，不是一条链</td></tr>
        <tr><td><b>轮 loop</b></td><td>聊天任务 / 交给子助手</td><td>都是按轮次与回传推进；子助手多一层审批与分工</td></tr>
        <tr><td><b>只读 mirror</b></td><td>关联已有后台任务</td><td>外部任务的镜像，不该伪装成本地步骤</td></tr>
      </tbody></table></div>
  </div></div>`;
}

/* ══════════ 说明与自检 ══════════ */
function specHtml(){
  return `<div class="wide"><div class="wide-inner">
    <div class="panel"><h1>设计口径与真实依据</h1><p>下拉里的 6 项来自本人截图；每个内容区的结构来自真实代码字段，不是凭空画的不同配色。预览里的任务名、章数、组数、子助手名都是示意。</p></div>
    <div class="panel"><h2>六类内容区 → 真实字段</h2>
      <table><thead><tr><th style="width:150px">类型</th><th>内容区结构</th><th>真实依据</th></tr></thead><tbody>
        <tr><td><b>织书台 · 原创写作</b></td><td>4 阶段轨道、分部（≤20 部）、章节网格、拆章范围、按章产物</td><td><code>domain.py:13</code> WRITER_CHAIN；<code>28-super-agent.js:35</code>；<code>index.html:1847-1849</code> 部标题 / 起始章号 / 拆章数量 / 单章正文</td></tr>
        <tr><td><b>拆书匠 · 小说改编</b></td><td>5 阶段轨道（导入、复核标为关卡）、原文范围、要素卡、剧本场次、复核门禁</td><td><code>domain.py:17,51-57</code> NOVEL_CHAIN 且 import / review 是 coordination gates；<code>index.html:1851</code> 起止章节</td></tr>
        <tr><td><b>批量制作视频</b></td><td>批次概览、8 张组卡、素材计数、逐组预检、就绪检查</td><td><code>28-super-agent.js:1595-1603</code> 组卡含 included / media / prompt / 逐组确认；<code>:1749-1775</code> 就绪检查</td></tr>
        <tr><td><b>聊天任务</b></td><td>目标、执行方式、轮次时间线、完成标准（含 [主观]）</td><td><code>index.html:1859-1865</code>；<code>28-super-agent.js:186-226</code> round / max_rounds / criteria / review_count</td></tr>
        <tr><td><b>关联已有后台任务</b></td><td>只读声明、源任务状态卡、状态记录、跳转入口；暂停 / 继续 / 取消置灰</td><td><code>index.html:1856,1875</code>「不会重新执行」；<code>28-super-agent.js:559-562</code> 不显示模型选项、禁用立即开始</td></tr>
        <tr><td><b>交给子助手</b></td><td>指令、分工卡、待确认操作（参数脱敏）、各自回传记录</td><td><code>28-super-agent.js:253-258</code> chat_confirmations 的 tool / reason / scope / action_source / 参数白名单；<code>index.html:1835</code> 沿用会话权限</td></tr>
      </tbody></table></div>
    <div class="panel"><h2>哪层统一、哪层差异化</h2><ul>
      <li><b>统一（壳）</b>：三栏骨架、深色侧栏、标题与状态 pill、暂停 / 继续 / 取消、三个指标卡、时间线、右栏「下一步 / 最近产物 / 相关入口」、深浅主题与手机规则、状态色语义。工具条「只看内容区」可以把壳弱化、直观验证这一点。</li>
      <li><b>差异化（芯）</b>：只有 <code>#contentZone</code> 这一块换结构；指标卡的<b>口径</b>随类型变（章 / 场 / 组 / 轮 / 项 / 分工），卡片本身不变。</li>
      <li><b>不做什么</b>：不给每类换主题色或图标皮；不靠类型名猜视图；不改操作语义与数据契约；不把只读任务伪装成本地步骤。</li>
      <li><b>路由依据</b>：现有 <code>domain</code> / <code>mode=recipe</code> / <code>supervision</code> 字段。字段缺失或历史任务一律回退通用视图，不白屏、不改历史结论。</li>
    </ul></div>
    <div class="panel"><h2>要拍板</h2><ul>
      <li><b>Q1</b> 六套内容区是<b>一次全做</b>，还是先做「批量制作视频」+「织书台」两种（收益最大、风险最小）？我建议后者。</li>
      <li><b>Q2</b> 指标卡口径随类型变之后，现有「仅统计已完成的真实步骤」这句说明要一起改，否则文案与数字对不上。</li>
      <li><b>Q3</b> 拆书匠的「导入 / 复核」要不要在真实界面里也标成关卡？这是后端事实，标出来能减少「为什么这步没调模型」的困惑。</li>
      <li><b>Q4</b> 「关联已有后台任务」是否要连暂停 / 继续 / 取消都隐藏，而不是置灰？置灰能说明「不是漏做」，隐藏更干净。</li>
      <li><b>Q5</b> 上一轮「上传素材入口」与「新建入口层级」仍未定案；这版内容区先按截图下拉的 6 项做，等入口定了一起收口。</li>
    </ul></div>
    <div class="panel"><h2>尺寸样本（同款组件，现场测量）</h2>
      <div class="measure-samples" style="display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:12px;margin-top:12px">
        <div style="padding:12px;border-radius:12px;background:var(--sidebar)"><button class="btn-new" data-m="btn-sample" type="button" style="margin:0">＋ 新建任务</button></div>
        <div style="padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)"><div class="mini-zone" data-m="zone-sample">${miniZone('cards')}</div><div style="margin-top:10px"><button class="mini-btn primary" data-m="dlg-btn" type="button">预检本组 · 确认生成</button></div></div>
      </div></div>
    <div class="panel"><h2>真实 DOM 自检</h2><p>由 <code>getBoundingClientRect()</code> / <code>scrollWidth</code> 现场读取；切换主题、手机视图、尺寸开关或视口大小后重算。</p><div class="selfcheck" id="selfcheck"></div></div>
    <div class="panel"><h2>边界</h2><ul>
      <li>只读真实前端结构，<b>没有修改 <code>public/*</code> 任何产品代码</b>，未启动真实实例、未创建任务、未调用模型。</li>
      <li>下拉按截图外观还原为自定义组件；原生 <code>&lt;select&gt;</code> 的展开样式由系统决定，落地时若要完全一致需再评估。</li>
      <li>缩略图、章节数、组数、子助手名均为 CSS / 文字占位，没有使用 <code>data/generated</code> 里的真实产物图。</li>
      <li>内容区是设计提案，不代表后端已有对应聚合接口；落地前需逐项核字段。</li>
    </ul></div>
  </div></div>`;
}

/* ══════════ 渲染与交互 ══════════ */
let currentType='novel', currentScene='single';
function renderTypeMenu(){
  el('typeMenu').innerHTML=ORDER.map(k=>`<button type="button" role="option" data-type="${k}" class="${k===currentType?'selected':''}" aria-selected="${k===currentType}">${TYPES[k].label}</button>`).join('');
  el('typeCurrentLabel').textContent=TYPES[currentType].label;
  $$('#typeMenu [data-type]').forEach(b=>b.addEventListener('click',()=>{
    currentType=b.dataset.type;closeTypeMenu();
    el('typeCurrentLabel').textContent=TYPES[currentType].label;
    if(currentScene==='gallery'||currentScene==='spec')setScene('single');else render();
    toast('已切换到：'+TYPES[currentType].label+' · 内容区已替换');
  }));
}
function closeTypeMenu(){el('typePicker').classList.remove('open');el('typeMenu').hidden=true;el('typeCurrent').setAttribute('aria-expanded','false')}
function setScene(s){currentScene=s;$$('.scene-tab').forEach(x=>x.classList.toggle('active',x.dataset.scene===s));render()}
function render(){
  const st=el('stage');
  if(currentScene==='gallery'){st.innerHTML=galleryHtml();bindCommon();applyMeasure();return}
  if(currentScene==='spec'){st.innerHTML=specHtml();bindCommon();applyMeasure();return}
  st.innerHTML=shellHtml(TYPES[currentType]);bindCommon();applyMeasure();
}
function bindCommon(){
  $$('[data-act]').forEach(b=>b.addEventListener('click',()=>toast('预览：'+b.dataset.act)));
  $$('[data-goto]').forEach(b=>b.addEventListener('click',()=>{currentType=b.dataset.goto;renderTypeMenu();setScene('single');toast('已切换到：'+TYPES[currentType].label)}));
  if(currentScene==='spec')runSelfCheck();
}
$$('.scene-tab').forEach(b=>b.addEventListener('click',()=>setScene(b.dataset.scene)));
el('typeCurrent').addEventListener('click',e=>{
  e.stopPropagation();const open=!el('typePicker').classList.contains('open');
  el('typePicker').classList.toggle('open',open);el('typeMenu').hidden=!open;
  el('typeCurrent').setAttribute('aria-expanded',String(open));
  if(open)renderTypeMenu();
});
document.addEventListener('click',e=>{if(!e.target.closest('#typePicker'))closeTypeMenu()});
el('zoneBtn').addEventListener('click',()=>{
  const on=!document.body.classList.contains('zone-only');
  document.body.classList.toggle('zone-only',on);el('zoneBtn').classList.toggle('active',on);
  toast(on?'外壳已弱化，高亮的就是随类型替换的内容区':'已恢复完整视图');
});
el('themeBtn').addEventListener('click',()=>{
  const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';
  el('themeBtn').querySelector('span').textContent=dark?'浅色':'深色';applyMeasure();
});
el('mobileBtn').addEventListener('click',()=>{
  const m=document.body.dataset.mobile!=='true';document.body.dataset.mobile=String(m);
  el('mobileBtn').classList.toggle('active',m);el('mobileBtn').querySelector('span').textContent=m?'桌面视图':'手机视图';applyMeasure();
});
el('measureBtn').addEventListener('click',()=>{
  const on=!document.body.classList.contains('show-measure');document.body.classList.toggle('show-measure',on);
  el('measureBtn').classList.toggle('active',on);el('measureBtn').querySelector('span').textContent=on?'尺寸 ✓':'尺寸';applyMeasure();
});

/* ── 尺寸标注 + 自检 ── */
function applyMeasure(){
  $$('[data-m]').forEach(n=>{const r=n.getBoundingClientRect();if(r.width>0)n.dataset.mSize=`${Math.round(r.width)}×${Math.round(r.height)}`});
  if(currentScene==='spec')runSelfCheck();
}
function runSelfCheck(){
  const host=el('selfcheck');if(!host)return;
  const rows=[],rect=s=>{const n=document.querySelector(s);return n?n.getBoundingClientRect():null};
  const add=(ok,label,value)=>rows.push(`<div class="sc ${ok?'':'bad'}"><i>${ok?'✓':'!'}</i><span>${label} <b>${value}</b></span></div>`);
  const pick=rect('[data-m="type-select"]'),btn=rect('[data-m="btn-sample"]'),zone=rect('#contentZone'),sbtn=rect('[data-m="dlg-btn"]');
  add(!pick||pick.height>=32,'类型下拉高度 ≥ 32px',pick?`${Math.round(pick.width)}×${Math.round(pick.height)}px`:'—');
  add(!btn||btn.height>=36,'新建按钮 ≥ 36px',btn?`${Math.round(btn.width)}×${Math.round(btn.height)}px`:'—');
  add(!sbtn||sbtn.height>=28,'内容区操作按钮 ≥ 28px',sbtn?`${Math.round(sbtn.width)}×${Math.round(sbtn.height)}px`:'—');
  add(!zone||zone.height>=200,'内容区高度 ≥ 200px',zone?`${Math.round(zone.width)}×${Math.round(zone.height)}px`:'需切到单任务详情');
  const main=document.querySelector('.sim-main'),stage=el('stage'),wide=document.querySelector('.wide');
  add(!main||main.scrollWidth<=main.clientWidth+1,'三栏内容区无横向溢出',main?`${main.scrollWidth} / ${main.clientWidth}px`:'—');
  add(!stage||stage.scrollWidth<=stage.clientWidth+1,'舞台无横向溢出',stage?`${stage.scrollWidth} / ${stage.clientWidth}px`:'—');
  add(document.documentElement.scrollWidth<=window.innerWidth+1,'当前视口无横向滚动',`${document.documentElement.scrollWidth} / ${window.innerWidth}px`);
  const hint=document.querySelector('.hint');const fs=n=>n?parseFloat(getComputedStyle(n).fontSize):0;
  add(!hint||fs(hint)>=11,'最小字号 ≥ 11px',hint?`${fs(hint)}px`:'—');
  const sig=new Set(ORDER.map(k=>TYPES[k].body()));
  add(sig.size===6,'六类内容区结构互异',`${sig.size} / 6 种不同结构`);
  const mobile=document.body.dataset.mobile==='true';
  add(!mobile||!wide||wide.scrollWidth<=wide.clientWidth+1,'手机视图内容区不溢出',mobile&&wide?`${wide.scrollWidth} / ${wide.clientWidth}px`:'当前为桌面');
  host.innerHTML=rows.join('');
}
window.addEventListener('resize',()=>applyMeasure());
renderTypeMenu();render();
</script>
