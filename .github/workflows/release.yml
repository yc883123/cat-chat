name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 4.0.1-beta
  RELEASE_TAG: v4.0.1-beta
  # 新名包（给人直接下载）：包内是 `cat-chat.exe`。
  PACKAGE_NAME: cat-chat-4.0.1-beta-windows-x64
  # 旧名包：只为兼容既存文档 / 教程 / 口耳相传的旧下载链接，内容与 `PACKAGE_NAME` 等价，
  # **仅包内 exe 名不同**。更新器从不消费 zip，所以它不参与自动更新链路。
  LEGACY_PACKAGE_NAME: naiba-chat-4.0.1-beta-windows-x64

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          # 构建依赖必须锁版本：2026-10-19 的 3.4.1 因未锁 PyMuPDF，构建当天上游发布
          # 2.0 大版本，PyInstaller 的 hook 还没跟上，打出的 exe 缺少文件、一启动就崩。
          python -m pip install --disable-pip-version-check --upgrade "pyinstaller==6.22.3" "pywebview==6.2.1" "pystray==0.19.5" "mcp==2.1.1" "pymupdf==1.28.2" "av==18.1.0" "python-multipart==0.0.32"
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir "pillow==13.0.0"
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Run tests
        timeout-minutes: 25
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          if (-not (Test-Path "tests")) {
            throw "tests directory not found; refusing to publish without unit tests."
          }
          python -u -X faulthandler -m unittest tests.test_recipe_ui_fixture tests.test_manju_presets tests.test_supervised_chat_recovery -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -u -X faulthandler -m unittest discover -s tests -v
          exit $LASTEXITCODE

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "${{ env.RELEASE_VERSION }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          # 发布前必须让打包产物真的跑一次：--self-check 会导入 PDF/视频/子代理等全部重依赖，
          # 缺 DLL/扩展会在这里复现。用超时等待，避免导入失败时 PyInstaller 的弹窗挂住 CI。
          $proc = Start-Process -FilePath "dist\naiba-chat.exe" -ArgumentList "--self-check" -PassThru
          if (-not $proc.WaitForExit(180000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "打包产物自检超时（很可能在导入阶段弹出了错误窗口），禁止发布"
          }
          if ($proc.ExitCode -ne 0) {
            throw "打包产物自检失败（exit $($proc.ExitCode)）：exe 缺少运行文件，禁止发布"
          }
          Write-Host "打包产物自检通过（--self-check exit 0）"

      - name: Create update manifest
        shell: pwsh
        run: |
          # !!! 更新协议常量，逐字不可改 !!!
          # 仓库已更名为 cat-chat（旧地址由 GitHub 301 长期重定向），但清单这三个字段是**已发布
          # 客户端逐字校验**的协议：`repository` 必须仍是 yc883123/naiba-chat、`asset` 必须仍是
          # naiba-chat.exe、sha256 仍对 dist\naiba-chat.exe 计算。改任何一个，全部历史版本用户
          # 会永久失去自动更新，且无法用版本号界定受影响范围。详见 naiba/updater.py 模块头注释。
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $releaseNotes = @(Get-Content -Raw -Encoding UTF8 release_notes.json | ConvertFrom-Json)
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "${{ env.RELEASE_VERSION }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = $releaseNotes
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Create Windows package
        shell: pwsh
        run: |
          # 两个 zip 装的是同一份字节（cat-chat.exe 是 naiba-chat.exe 的副本，SHA-256 相同），
          # 区别只在包内 exe 的文件名：新名包给人下载，旧名包留给既存的旧链接。
          Copy-Item -LiteralPath "dist\naiba-chat.exe" -Destination "dist\cat-chat.exe" -Force
          foreach ($pair in @(
              @{ Name = "${{ env.PACKAGE_NAME }}";        Exe = "cat-chat.exe" },
              @{ Name = "${{ env.LEGACY_PACKAGE_NAME }}"; Exe = "naiba-chat.exe" }
          )) {
            $packageDir = Join-Path "dist" $pair.Name
            New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
            Copy-Item -LiteralPath "dist\$($pair.Exe)" -Destination $packageDir
            Copy-Item -LiteralPath "naiba-chat-update.json" -Destination $packageDir
            Copy-Item -LiteralPath "README.md" -Destination $packageDir
            Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\$($pair.Name).zip" -Force
          }

      - name: Publish 4.0.1 Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Cat Chat 4.0.1 Beta
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            dist/cat-chat.exe
            dist/${{ env.PACKAGE_NAME }}.zip
            dist/${{ env.LEGACY_PACKAGE_NAME }}.zip
            naiba-chat-update.json
          body: |
            Cat Chat 4.0.1 Beta：漫剧统一技能、官方 H3 有界配方与安全生成交接
            ① 漫剧双入口：纳入此前尚未推送的 861e0fb，提词库新增 21 个漫剧题材模板，并提供统一漫剧 Skill 按需读取 21 份参考原文；保留 MIT 许可、上游来源与文件校验哈希。模板和 Skill 只提供创作指导，不新增工具能力或授权。
            ② 内置视频配方：任务总管新增由 ComfyUI 官方 MiniMax H3 图生视频（I2V）和参考生视频（R2V）派生的固定配方，参考 shortdrama 与 H3 提示词指南；每个素材项目一次反推、审核后再交给造梦机，不额外插入规划或剧情拆分轮次。
            ③ 素材与清单：逐项保存素材、提示词和执行进度，区分首帧与身份/场景参考；R2V 图片连续编号、最多六张，未接入的音频/视频参考不冒充支持。同名、重复、嵌套、坏图、超限及越界输入显式校验，受管素材保留原件并保护待确认引用。
            ④ 两道确认：先确认反推，再审核提示词并确认生成；生成审核展示逐项实际派生图、精确槽位值、媒体绑定、模型和目标地址。确认绑定版本与摘要，素材、模型、目标或未执行参数变化后失效，不静默切换模型、供应商或工作流。
            ⑤ 原生执行防重：复用 Studio 与 ComfyUI 原生执行器，以 owner/request_key 持久防重并核对载荷；双击、并发和响应丢失不会重复派发。保留原生执行关联与轮次，远端提交结果未知时只对账、不盲目重放。
            ⑥ 恢复与取消：反推、生成、下载收集分别恢复，生成失败不重新反推、下载失败只补收集原任务而不重新生成；重启等待用户继续。暂停/取消阻止后续派发，不误停其他入口，远端取消尚未确认时如实保留 pending_remote，不把取消请求当成取消成功。
            ⑦ 反推原文与严格校验：直接保留模型原始正文，独立 reasoning 不混入提示词，不以清理或截断后的显示文本替代；I2V 三字段、R2V 六字段按固定顺序唯一出现，标签、时长、空值、多结果、额外字段及超长内容不合格时等待人工修正，不自动猜测修补。
            ⑧ 自定义配方：造梦机可将当前工作流交给总管，显式选择文本槽、媒体业务角色、逐项/公共范围、模板与结果规则，保存可复用快照；仅保存不执行，不覆盖源工作流、提词库原件或普通参数草稿。
            ⑨ 参数保真：自定义额外覆盖目前只开放数值与布尔值，保持大整数种子等数值精度；改过但不支持的字符串/枚举字段明确拒绝，不静默恢复原值，需要先另存工作流再交接。已执行输入不被改稿覆盖，生成后改稿需新建批次。
            ⑩ 产物事实与损坏恢复：完成状态同时核对原生终态与实际落地文件，部分成功、下载失败、丢失或损坏产物不报全部完成；已生成产物失效时只允许补收集，不借恢复入口重新生成。
            ⑪ 自动化验证：已有本轮全量回归 4006 项通过，未定义名、ESM 链接、TDZ、文档编码及修改脚本语法检查通过；补充目录来源/哈希、原文回调、防重、配置漂移、精确参数、异常恢复与隔离原生 HTTP 守门。
            ⑫ 浏览器与视频验证：桌面及 375px 手机覆盖受支持的创建/审核/编辑保存、两次确认、原生执行关联、结果刷新和单项补收集；隔离夹具以本地合成 MP4 验证 HTTP 收集、浏览器解码与播放，不代表真实 H3 画面质量。
            ⑬ 明确边界：未运行真实 H3 GPU 推理或真实供应商反推/付费服务，未验证真实安装的节点与模型兼容性；任意 DAG 尚未实现。生产视频仅做容器基本结构合理性检查，不承诺逐文件完整解码或生成质量审查，完整 PyInstaller 打包运行也未在本轮验证。
            ⑭ GUI 验收范围：当前浏览器能力不支持系统文件选择上传，完整“选择文件/目录 → 上传导入 → 创建批次”GUI 路径未验证；浏览器后端也缺少完整 console/pageerror 订阅。HTTP 夹具和单测不能替代这些缺口，不宣称完整 GUI 或全部验收已通过。
            ⑮ 发布前修正：漫剧转换 CLI 显式使用 UTF-8，隔离上传测试统一 Windows 路径规范化；自动续办审查的事件列表和总数改为同一 SQLite 快照，修复最终事件并发落库导致完整结果被误判截断的问题，真实超限仍拒绝完成。启动就绪清单改为原子发布，避免读到刚创建的空 JSON；CI 先执行夹具、漫剧与监督恢复前置门禁，全量测试只跑一次并设明确超时，失败不再整套自动重跑。
            Cat Chat 4.0.1 Beta Windows build。更新协议、既有数据位置和双名称发布资产保持兼容。
