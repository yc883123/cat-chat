<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>任务总管 · 新建入口与流程视图设计预览</title>
<!--
  设计层提案：不连接真实任务、不调用模型、不写入数据、不修改任何产品代码。
  依据（2026-11-04 读取真实前端）：
    public/index.html:1682-1683  侧栏两个新建按钮
    public/index.html:1734-1799  新建批量任务 / 交接两个 dialog
    public/index.html:1826-1884  新建任务 dialog（5 类 domain）
    public/js/28-super-agent.js:35-39, 965, 1996  CHAINS / domainName / 两个按钮绑定
    public/styles.css:6110-6136  三栏网格 262/1fr/322、深色侧栏、新建按钮层级
  预览里的字段、任务名、组数均为代表性示意，不逐字复刻当前工作树。
  沿用 public/styles.css 现有 :root 令牌名，不另起色板。
-->
<style>
:root{
  color-scheme:light;
  --brand-100:#EDECFF; --brand-200:#DCD3FF; --brand-500:#7C5CFF; --brand-600:#6D5AE6; --brand-700:#5A47C4;
  --neutral-0:#fff; --neutral-50:#F8F9FC; --neutral-100:#F1F2F7; --neutral-200:#E6E8F0; --neutral-300:#D2D6E3;
  --neutral-400:#A9AFC2; --neutral-500:#7A8099; --neutral-600:#5A6079; --neutral-700:#3D4257; --neutral-800:#2A2E40; --neutral-900:#1E2138;
  --bg:#F6F7FB; --surface:var(--neutral-0); --surface-2:var(--neutral-100); --surface-inset:#F5F6FA;
  --line:var(--neutral-200); --line-strong:var(--neutral-300);
  --text:var(--neutral-800); --muted:var(--neutral-500);
  --accent:var(--brand-500); --accent-solid:var(--brand-600); --accent-soft:var(--brand-100);
  --sidebar:#1E2138; --sidebar-line:#31354E; --sidebar-hover:#2A2E49; --sidebar-text:#F1F2F7; --sidebar-muted:#989FC0;
  --success:#12A594; --success-soft:#DCF4F0; --warning:#D9820B; --warning-soft:#FCF0E0;
  --danger:#DC4A46; --danger-soft:#FCE8E7; --info:#3B82C4; --info-soft:#E6F1FB;
  --r-sm:6px; --r-md:9px; --r-lg:13px; --r-xl:18px; --r-full:999px;
  --shadow-1:0 1px 2px rgba(30,33,56,.05),0 1px 3px rgba(30,33,56,.04);
  --shadow-2:0 6px 20px rgba(30,33,56,.09),0 2px 6px rgba(30,33,56,.045);
  --shadow-3:0 18px 48px rgba(30,33,56,.20),0 4px 12px rgba(30,33,56,.08);
  --font-sans:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --neutral-0:#171A24; --neutral-50:#111522; --neutral-100:#1D2130; --neutral-200:#2B3143; --neutral-300:#3D455C;
  --neutral-400:#66708A; --neutral-500:#8D96AD; --neutral-600:#AEB6C8; --neutral-700:#C8CEDA; --neutral-800:#E3E7EF; --neutral-900:#0D1019;
  --bg:#111522; --surface:#171A24; --surface-2:#1D2130; --surface-inset:#121620;
  --line:#2B3143; --line-strong:#3D455C; --text:#E3E7EF; --muted:#8D96AD;
  --accent-soft:#2A2350; --sidebar:#0D1019; --sidebar-line:#282D40; --sidebar-hover:#1D2130; --sidebar-text:#E3E7EF; --sidebar-muted:#9CA6BD;
  --success-soft:#163C3B; --warning-soft:#46351A; --danger-soft:#452322; --info-soft:#183044;
  --shadow-1:0 1px 2px rgba(0,0,0,.25); --shadow-2:0 6px 20px rgba(0,0,0,.3); --shadow-3:0 18px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13.5px/1.6 var(--font-sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,h4,p{margin:0}
[hidden]{display:none!important}

/* ── 预览工具条 ── */
.preview-bar{height:54px;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:30}
.preview-kicker{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;white-space:nowrap}
.preview-kicker i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.preview-note{color:var(--muted);font-size:11.5px;white-space:nowrap}
.scene-tabs{display:flex;gap:2px;padding:3px;margin-left:6px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);overflow-x:auto;scrollbar-width:none}
.scene-tabs::-webkit-scrollbar{display:none}
.scene-tab{border:0;border-radius:6px;padding:5px 10px;background:transparent;color:var(--muted);font-size:12px;white-space:nowrap}
.scene-tab:hover{color:var(--text)}
.scene-tab.active{background:var(--surface);color:var(--accent-solid);font-weight:650;box-shadow:var(--shadow-1)}
.preview-spacer{flex:1}
.demo-control{height:31px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--muted);padding:0 10px;font-size:12px;white-space:nowrap;flex:none}
.demo-control:hover{border-color:var(--accent);color:var(--text)}
.demo-control.active{color:var(--accent-solid);border-color:var(--accent);background:var(--accent-soft)}
.demo-control svg{width:15px;height:15px}

/* ── 舞台：仿真三栏任务总管 ── */
.stage{position:fixed;inset:54px 0 0;background:var(--bg);overflow:hidden}
.sim{display:grid;grid-template-columns:262px minmax(0,1fr) 322px;grid-template-rows:58px minmax(0,1fr);height:100%;min-height:0}
.sim-sidebar{grid-column:1;grid-row:1/3;display:flex;flex-direction:column;min-height:0;background:var(--sidebar);color:var(--sidebar-text);border-right:1px solid var(--sidebar-line)}
.brand{display:flex;align-items:center;gap:11px;padding:18px 16px 14px}
.brand-mark{width:32px;height:32px;display:grid;place-items:center;border:1px solid #a28dff;border-radius:10px;background:linear-gradient(145deg,#a78bfa,#7254e5);color:#fff;font-size:17px;font-weight:700;box-shadow:0 3px 14px #7c5cff55}
.brand-copy{display:grid;gap:2px}.brand-copy strong{font-size:15px}.brand-copy small{color:var(--sidebar-muted);font-size:11px}
.app-nav{display:flex;gap:3px;margin:0 12px;padding:3px;border-radius:var(--r-md);background:var(--sidebar-hover)}
.app-nav button{flex:1;border:0;border-radius:var(--r-sm);padding:6px 4px;background:transparent;color:var(--sidebar-muted);font-size:12px}
.app-nav button[aria-current="page"]{background:#7c5cff44;color:#fff;font-weight:600}
.panel-head{display:flex;justify-content:space-between;padding:8px 18px;color:var(--sidebar-muted);font-size:11px}
.filters{display:flex;gap:5px;padding:0 12px 6px}.filters button{border:0;border-radius:var(--r-sm);padding:5px 7px;background:transparent;color:var(--sidebar-muted);font-size:11px}
.filters button[aria-pressed="true"]{background:var(--sidebar-hover);color:var(--sidebar-text)}
.thread-list{display:flex;flex-direction:column;gap:6px;padding:4px 10px;overflow:auto;min-height:0;flex:1}
.thread{display:grid;gap:3px;padding:10px;border:1px solid transparent;border-radius:var(--r-md);color:var(--sidebar-text);text-align:left}
.thread:hover{background:var(--sidebar-hover)}
.thread.active{border-color:#a28dff66;background:#7c5cff33}
.thread strong{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread small{color:var(--sidebar-muted);font-size:11px;padding-left:26px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-ico{width:19px;height:19px;display:grid;place-items:center;border-radius:5px;background:#ffffff0a;color:var(--sidebar-muted);font-size:12px;font-style:normal}
.list-note{margin:auto 0 0;padding:14px 18px;border-top:1px solid var(--sidebar-line);color:var(--sidebar-muted);font-size:11px}
.sim-topbar{grid-column:2/4;grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.sim-topbar strong{color:var(--text);font-weight:600}
.sim-main{grid-column:2;grid-row:2;min-width:0;min-height:0;overflow:auto;padding:18px;background:color-mix(in srgb,var(--accent-soft) 22%,var(--surface))}
.sim-aside{grid-column:3;grid-row:2;min-width:0;min-height:0;overflow:auto;display:grid;gap:12px;align-content:start;padding:14px;background:var(--surface-inset);border-left:1px solid var(--line)}
.aside-card{padding:13px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.aside-card h3{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
.aside-ref{font-size:12px}.aside-ref p{margin-top:5px;color:var(--muted);font-size:11.5px;line-height:1.6}
.aside-link{display:flex;width:100%;padding:7px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);font-size:12px;text-align:left;justify-content:space-between}
.aside-link:last-child{border-bottom:0}.aside-link:hover{color:var(--accent-solid)}.aside-link em{font-style:normal;color:var(--muted);font-size:11px}

/* ── 侧栏新建区：4 种形态 ── */
.entry{padding:0 12px 10px}
.btn-new{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:8px 12px;border:1px solid rgba(155,130,255,.5);border-radius:var(--r-md);background:rgba(124,92,255,.18);color:var(--sidebar-text);font-size:13px;font-weight:600;text-align:left}
.btn-new:hover{background:rgba(124,92,255,.3)}
.btn-new svg{width:16px;height:16px}
.btn-new.primary-solid{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
.btn-new.primary-solid:hover{background:var(--brand-700)}
.btn-sub{display:block;width:100%;min-height:34px;margin-top:4px;padding:6px 12px;border:1px solid transparent;border-radius:var(--r-md);background:transparent;color:var(--sidebar-muted);font-size:12px;text-align:left}
.btn-sub:hover{background:var(--sidebar-hover);color:var(--sidebar-text)}
.entry-label{margin:12px 12px 6px;color:var(--sidebar-muted);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.entry-select{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:0 12px 10px}
.entry-select select{min-width:0;height:38px;padding:0 8px;border:1px solid var(--sidebar-line);border-radius:var(--r-md);background:var(--sidebar-hover);color:var(--sidebar-text);font-size:12px}
.entry-select button{height:38px;padding:0 12px;border:1px solid rgba(155,130,255,.5);border-radius:var(--r-md);background:rgba(124,92,255,.18);color:var(--sidebar-text);font-size:12px;font-weight:600;white-space:nowrap}
.entry-caption{padding:0 12px 8px;color:var(--sidebar-muted);font-size:10.5px;line-height:1.5}
.shortcut{margin:0 12px 10px;padding:10px;border:1px solid var(--sidebar-line);border-radius:var(--r-lg);background:rgba(255,255,255,.035)}
.shortcut small{display:block;color:var(--sidebar-muted);font-size:10.5px;margin-bottom:6px}
.shortcut button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border:1px solid transparent;border-radius:var(--r-md);background:transparent;color:var(--sidebar-text);font-size:12px;text-align:left}
.shortcut button:hover{border-color:#a28dff55;background:var(--sidebar-hover)}
.shortcut button em{margin-left:auto;font-style:normal;color:var(--sidebar-muted);font-size:10px}

/* ── 现状批注 ── */
.callout{display:flex;align-items:flex-start;gap:8px;margin:0 0 12px;padding:10px 12px;border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));border-radius:var(--r-md);background:var(--danger-soft);font-size:12px;line-height:1.6}
.callout svg{width:16px;height:16px;color:var(--danger);margin-top:2px}
.callout.neutral{border-color:color-mix(in srgb,var(--info) 40%,var(--line));background:var(--info-soft)}
.callout.neutral svg{color:var(--info)}
.callout.good{border-color:color-mix(in srgb,var(--success) 40%,var(--line));background:var(--success-soft)}
.callout.good svg{color:var(--success)}
.tag{display:inline-block;padding:1px 7px;border-radius:var(--r-full);background:var(--surface-2);color:var(--muted);font-size:10.5px;font-weight:600}
.tag.warn{background:var(--warning-soft);color:var(--warning)}
.tag.ok{background:var(--success-soft);color:var(--success)}

/* ── 中间栏：统一外壳 ── */
.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{color:var(--muted);font-size:11px;letter-spacing:.04em}
.detail-head h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:4px 0 3px}
.detail-head p{color:var(--muted);font-size:12px;line-height:1.55}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:var(--r-full);font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.run{background:var(--accent-soft);color:var(--accent-solid)}
.pill.ok{background:var(--success-soft);color:var(--success)}
.pill.wait{background:var(--warning-soft);color:var(--warning)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.pill.idle{background:var(--surface-2);color:var(--muted)}
.detail-actions{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.mini-btn{min-height:30px;padding:0 11px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-size:11.5px}
.mini-btn:hover{border-color:var(--accent);color:var(--accent-solid)}
.mini-btn.primary{border-color:var(--accent-solid);background:var(--accent-solid);color:#fff}
.control-note{color:var(--muted);font-size:11px;margin:0 0 14px;line-height:1.55}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.metric{padding:12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.metric h3{font-size:11px;color:var(--muted);font-weight:600}
.metric strong{display:block;margin-top:5px;font-size:16px;font-weight:700}
.metric small{display:block;margin-top:3px;color:var(--muted);font-size:10.5px;line-height:1.5}
.metric progress{width:100%;height:5px;margin-top:8px;accent-color:var(--accent-solid)}
.sec{margin-bottom:16px;padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-1)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.sec-head h2{font-size:13px;font-weight:700}
.sec-head span{color:var(--muted);font-size:11px}
.hint{color:var(--muted);font-size:11.5px;line-height:1.65}
.flow-tabs{display:flex;gap:5px;padding:4px;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);width:fit-content;max-width:100%;overflow-x:auto}
.flow-tab{border:0;border-radius:6px;padding:6px 12px;background:transparent;color:var(--muted);font-size:12px;white-space:nowrap}
.flow-tab.active{background:var(--surface);color:var(--accent-solid);font-weight:650;box-shadow:var(--shadow-1)}
.shell-note{display:flex;align-items:center;gap:7px;margin-bottom:12px;padding:7px 10px;border:1px dashed var(--line-strong);border-radius:var(--r-md);color:var(--muted);font-size:11px;background:var(--surface-inset)}
.shell-note svg{width:14px;height:14px;color:var(--accent-solid)}

/* 流程 A：线性链 */
.stage-track{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:14px}
.track-node{position:relative;padding:0 8px 0 0;min-width:0}
.track-node .dot{position:relative;z-index:2;width:26px;height:26px;display:grid;place-items:center;border:1.5px solid var(--line-strong);border-radius:50%;background:var(--surface);color:var(--muted);font-size:11px;font-weight:700}
.track-node .line{position:absolute;left:26px;top:13px;right:0;height:1.5px;background:var(--line-strong)}
.track-node:last-child .line{display:none}
.track-node.done .dot{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.track-node.done .line{background:var(--success)}
.track-node.current .dot{border-color:var(--accent-solid);background:var(--accent-solid);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.track-node b{display:block;margin-top:8px;font-size:12px;font-weight:650}
.track-node small{display:block;color:var(--muted);font-size:10.5px;line-height:1.5}
.chapter-grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.chapter{aspect-ratio:1;display:grid;place-items:center;border:1px solid var(--line);border-radius:5px;background:var(--surface-inset);font-size:10px;color:var(--muted)}
.chapter.done{background:var(--success-soft);border-color:color-mix(in srgb,var(--success) 35%,var(--line));color:var(--success);font-weight:700}
.chapter.current{background:var(--accent-soft);border-color:var(--accent-solid);color:var(--accent-solid);font-weight:700}
.chapter.pending{opacity:.55}
.row-list{display:grid;gap:7px;margin-top:10px}
.row-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px}
.row-item b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-item em{font-style:normal;color:var(--muted);font-size:10.5px}

/* 流程 B：批次看板 */
.batch-summary{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kv{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:var(--r-full);background:var(--surface);font-size:11.5px;color:var(--muted)}
.kv b{color:var(--text);font-weight:700}
.batch-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.batch{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.batch-media{position:relative;aspect-ratio:16/10;display:grid;place-items:center;color:rgba(255,255,255,.8);font-size:10px;text-align:center;background:linear-gradient(135deg,#2C3350,#4A4270)}
.batch-media.b2{background:linear-gradient(135deg,#3D3152,#6B4A72)}
.batch-media.b3{background:linear-gradient(135deg,#26405A,#3C6B78)}
.batch-media.b4{background:linear-gradient(135deg,#3A3F4B,#5B6070)}
.batch-media .ph{display:grid;place-items:center;gap:4px}
.batch-media .ph svg{width:18px;height:18px;opacity:.85}
.batch-tag{position:absolute;left:7px;top:7px;padding:2px 7px;border-radius:var(--r-full);background:rgba(0,0,0,.45);color:#fff;font-size:10px}
.batch-body{padding:9px 10px}
.batch-body b{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;font-weight:650}
.batch-body p{margin-top:4px;color:var(--muted);font-size:10.5px;line-height:1.5;max-height:32px;overflow:hidden}
.check-list{display:grid;gap:7px;margin-top:12px}
.check{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.check i{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--success-soft);color:var(--success);font-size:11px;font-weight:700;font-style:normal;flex:none}
.check.warn i{background:var(--warning-soft);color:var(--warning)}
.check b{color:var(--text);font-weight:600}

/* 流程 C：轮次时间线 */
.round{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;padding-bottom:14px;border-left:1.5px solid var(--line-strong);margin-left:34px;position:relative}
.round:last-child{border-left-color:transparent;padding-bottom:0}
.round .badge{position:absolute;left:-14px;top:0;width:27px;height:27px;display:grid;place-items:center;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-strong);color:var(--muted);font-size:10px;font-weight:700}
.round.done .badge{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.round.active .badge{border-color:var(--accent-solid);background:var(--accent-soft);color:var(--accent-solid)}
.round-label{padding-top:4px;color:var(--muted);font-size:11px;font-weight:600}
.round-body{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-inset)}
.round-body b{font-size:12px;font-weight:650}
.round-body p{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.6}
.criteria{display:grid;gap:7px;margin-top:12px}
.crit{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px}
.crit i{font-style:normal;color:var(--success);font-weight:700;flex:none}
.crit.wait i{color:var(--warning)}
.crit small{color:var(--muted);font-size:10.5px}

/* ── 弹窗：沿用 .sa-dialog 三段式 ── */
.sa-dialog{width:min(var(--dlg-w,760px),calc(100vw - 32px));max-width:calc(100vw - 32px);max-height:min(88dvh,900px);padding:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);box-shadow:var(--shadow-3);overflow:hidden}
.sa-dialog[open]{display:flex;flex-direction:column}
.sa-dialog::backdrop{background:rgba(14,17,30,.55);backdrop-filter:blur(3px)}
html[data-theme="dark"] .sa-dialog::backdrop{background:rgba(4,6,14,.72)}
.dlg-head{flex:none;display:flex;align-items:flex-start;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.dlg-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent-solid)}
.dlg-ico svg{width:18px;height:18px}
.dlg-head-copy{flex:1;min-width:0}
.dlg-head-copy h2{font-size:16px;font-weight:700;line-height:1.35}
.dlg-head-copy p{margin-top:3px;color:var(--muted);font-size:12px;line-height:1.55}
.dlg-close{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid transparent;border-radius:var(--r-md);background:transparent;color:var(--muted)}
.dlg-close:hover{border-color:var(--line);background:var(--surface-2);color:var(--text)}
.dlg-close svg{width:16px;height:16px}
.dlg-body{flex:1 1 auto;min-height:0;overflow:auto;padding:18px 20px}
.dlg-foot{flex:none;display:flex;align-items:center;gap:12px;padding:13px 20px;border-top:1px solid var(--line);background:var(--surface)}
.foot-hint{flex:1;min-width:0;color:var(--muted);font-size:11.5px;line-height:1.55}
.foot-btns{display:flex;align-items:center;gap:9px;flex:none}
.btn{min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);color:var(--text);font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent-solid)}
.btn-primary{border-color:var(--accent-solid);background:var(--accent-solid);color:#fff}
.btn-primary:hover{background:var(--brand-700);color:#fff;border-color:var(--brand-700)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted)}

/* 启动台 */
.launcher-group{margin-bottom:18px}
.launcher-group:last-child{margin-bottom:2px}
.lg-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.lg-head h3{font-size:12px;font-weight:700}
.lg-head span{color:var(--muted);font-size:11px}
.type-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.type-card{position:relative;display:flex;align-items:flex-start;gap:11px;min-height:86px;padding:13px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-inset);text-align:left;color:var(--text)}
.type-card:hover{border-color:var(--accent);background:var(--accent-soft);box-shadow:var(--shadow-1)}
.type-card .tc-ico{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--accent-soft);color:var(--accent-solid)}
.type-card .tc-ico svg{width:18px;height:18px}
.tc-copy{flex:1;min-width:0}
.tc-copy b{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650}
.tc-copy p{margin-top:4px;color:var(--muted);font-size:11.5px;line-height:1.6}
.tc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tc-meta .tag{font-size:10px}
.recent{position:absolute;right:11px;top:11px;font-size:10px;color:var(--accent-solid);font-weight:600}
.type-card.disabled{opacity:.55}
.type-card.disabled:hover{border-color:var(--line);background:var(--surface-inset);box-shadow:none}

/* 表单示意 */
.field{display:block;margin-bottom:12px}
.field > span{display:block;margin-bottom:6px;font-size:12px;font-weight:600}
.field > small{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.6}
.input,.textarea,.select{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface-inset);color:var(--text);font-size:12.5px;line-height:1.6}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 3px var(--accent-soft)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-row .field{margin-bottom:12px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.mode-card{padding:12px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-inset);text-align:left;color:var(--text)}
.mode-card.active{border-color:var(--accent);background:var(--accent-soft)}
.mode-card b{font-size:12.5px;font-weight:650}
.mode-card p{margin-top:5px;color:var(--muted);font-size:11.5px;line-height:1.6}
.chain-preview{display:flex;flex-wrap:wrap;gap:6px 16px;margin:0;padding-left:18px;color:var(--accent-solid);font-size:11.5px}

/* ── 全宽说明 / 对照 ── */
.wide{position:fixed;inset:54px 0 0;overflow:auto;padding:22px;background:var(--bg)}
.wide-inner{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.wide h1{font-size:18px;font-weight:700}
.wide h2{font-size:14px;font-weight:700;margin-bottom:10px}
.wide p{font-size:12.5px;line-height:1.75;color:var(--muted)}
.panel{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:var(--shadow-1)}
.compare{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.compare-card{padding:14px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface-inset)}
.compare-card.rec{border-color:var(--accent);background:var(--accent-soft)}
.compare-card h3{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.compare-card .sub{color:var(--muted);font-size:11.5px;margin:5px 0 10px;line-height:1.6}
.compare-card ul{margin:0;padding-left:17px;font-size:11.5px;line-height:1.9;color:var(--muted)}
.compare-card ul b{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;line-height:1.6}
th{color:var(--muted);font-weight:600;font-size:11px;background:var(--surface-inset)}
td b{font-weight:650}
.panel ul{margin:0;padding-left:18px;font-size:12px;line-height:1.9;color:var(--muted)}
.panel ul b{color:var(--text)}
.q{display:grid;gap:9px}
.q-row{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:12px;line-height:1.65}
.q-row b{color:var(--accent-solid)}
.selfcheck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sc{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-inset);font-size:11.5px}
.sc i{width:18px;height:18px;display:grid;place-items:center;border-radius:50%;background:var(--success-soft);color:var(--success);font-size:11px;font-style:normal;font-weight:700;flex:none}
.sc.bad i{background:var(--danger-soft);color:var(--danger)}
.sc span{color:var(--muted)}
.sc b{color:var(--text);font-weight:650}

/* ── 尺寸标注 ── */
body.show-measure [data-m]{position:relative;outline:1px dashed var(--accent)}
body.show-measure [data-m]::after{content:attr(data-m-size);position:absolute;right:0;top:0;z-index:12;padding:1px 5px;border-radius:4px;background:var(--accent-solid);color:#fff;font-size:9.5px;line-height:1.5;white-space:nowrap;pointer-events:none}

/* ── 手机视图 ── */
body[data-mobile="true"] .sim{grid-template-columns:minmax(0,1fr);grid-template-rows:58px minmax(0,1fr)}
body[data-mobile="true"] .sim-sidebar{display:none}
body[data-mobile="true"] .sim-aside{display:none}
body[data-mobile="true"] .sim-topbar{grid-column:1;grid-row:1;padding:0 14px}
body[data-mobile="true"] .sim-main{grid-column:1;grid-row:2;padding:14px}
body[data-mobile="true"] .metrics{grid-template-columns:1fr 1fr}
body[data-mobile="true"] .batch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
body[data-mobile="true"] .stage-track{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 0}
body[data-mobile="true"] .chapter-grid{grid-template-columns:repeat(8,minmax(0,1fr))}
body[data-mobile="true"] .sa-dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border:0;border-radius:0;margin:0}
body[data-mobile="true"] .dlg-head{padding-top:max(17px,env(safe-area-inset-top))}
body[data-mobile="true"] .dlg-foot{padding-bottom:max(14px,env(safe-area-inset-bottom))}
body[data-mobile="true"] .dlg-body{padding:16px}
body[data-mobile="true"] .type-grid,body[data-mobile="true"] .field-row,body[data-mobile="true"] .mode-cards{grid-template-columns:1fr}
body[data-mobile="true"] .foot-hint{display:none}
body[data-mobile="true"] .foot-btns{width:100%}
body[data-mobile="true"] .foot-btns .btn{flex:1}
body[data-mobile="true"] .preview-note{display:none}
body[data-mobile="true"] .compare,body[data-mobile="true"] .selfcheck{grid-template-columns:1fr}
body[data-mobile="true"] .measure-samples{grid-template-columns:1fr!important}
body[data-mobile="true"] .wide{padding:14px}
@media(max-width:1100px){.preview-note{display:none}.scene-tab{padding:5px 8px}}
@media(max-width:640px){
  .preview-bar{gap:6px;padding:0 8px;overflow-x:auto;scrollbar-width:none}
  .preview-bar::-webkit-scrollbar{display:none}
  .preview-kicker{flex:none}.preview-kicker span{display:none}
  .scene-tabs{margin-left:0}
  .preview-spacer{display:none}
  .demo-control{padding:0 7px;flex:none}.demo-control span{display:none}
  .wide table{min-width:0}
  .panel{overflow-x:auto}
}
@media(max-width:900px){.compare{grid-template-columns:1fr}.selfcheck{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;bottom:22px;z-index:90;transform:translate(-50%,8px);padding:9px 16px;border-radius:var(--r-full);background:var(--neutral-800);color:#fff;font-size:12px;box-shadow:var(--shadow-3);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>

  const d=el('dlg');d.style.setProperty('--dlg-w',(o.w||760)+'px');d.innerHTML=dialogHtml(o);

  d.querySelectorAll('.type-card').forEach(c=>c.addEventListener('click',()=>openForm(c.dataset.type)));

    main=emptyMain({tone:'neutral',text:'<b>方案 C · 主入口 + 快捷方式</b>：保留 B 的启动台，同时给高频类型一个「1 步直达」。关键是把它放进独立的「快捷开始」分组，并写明「新建任务的一种」，不再与主动作并排。',

        <div class="row-item"><b>好处</b><em>老用户 1 步进批量视频；新用户仍看到完整类型列表</em></div>
        <div class="row-item"><b>风险</b><em>两个可点区域，视觉分区一弱就又被读成并列</em></div>
        <div class="row-item"><b>建议</b><em>只有确实存在高频类型时才加；且只能有 1 个，不能变成第二排按钮</em></div>
      </div></div>`});
  }else{
    entry=entryLauncher();
    main=flowShell(flowTab);
  }
  st.innerHTML=shell(entry,main);
  el('crumb').textContent=current==='flows'?'任务进展与结果':'任务进展与结果';
  if(current==='flows')fillFlow(flowTab);
  bindStage();applyMeasure();
}
function fillFlow(tab){
  const m=FLOWMETA[tab];
  el('flowTitle').textContent=m.title;el('flowSub').textContent=m.sub;
  el('m1h').textContent=m.m1h;el('m1v').textContent=m.m1v;el('m1s').textContent=m.m1s;
  el('m2h').textContent=m.m2h;el('m2v').textContent=m.m2v;el('m2s').textContent=m.m2s;
  el('flowPill').textContent=tab==='batch'?'待确认':tab==='loop'?'第 2 轮':'进行中';
  el('flowBody').innerHTML=m.body();
  $$('.flow-tab').forEach(b=>b.addEventListener('click',()=>{flowTab=b.dataset.flow;render()}));
}

/* ── 对照 / 说明 ── */
function wideHtml(kind){

/* ── 交互绑定 ── */
function bindStage(){
  $$('[data-open]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.open;
    if(k==='launcher')openLauncher();
    else if(k==='form')openForm(b.dataset.type);
    else if(k==='form-from-select')openForm(el('entryType').value);
  }));
  $$('.thread').forEach(b=>b.addEventListener('click',()=>toast('预览：切换任务（不加载数据）')));
}
function bindWide(){
  $$('.compare-card').forEach(c=>c.addEventListener('click',()=>toast('预览：可在上方场景切换查看该方案')));
  if(current==='notes')runSelfCheck();
}
$$('.scene-tab').forEach(b=>b.addEventListener('click',()=>{
  current=b.dataset.scene;$$('.scene-tab').forEach(x=>x.classList.toggle('active',x===b));render();
}));
el('themeBtn').addEventListener('click',()=>{
  const dark=document.documentElement.dataset.theme!=='dark';
  document.documentElement.dataset.theme=dark?'dark':'light';
  el('themeBtn').querySelector('span').textContent=dark?'浅色':'深色';
  toast(dark?'已切换深色：侧栏仍为深色系，弹窗输入面保持可读':'已切换浅色');applyMeasure();
});
el('mobileBtn').addEventListener('click',()=>{
  const m=document.body.dataset.mobile!=='true';document.body.dataset.mobile=String(m);
  el('mobileBtn').classList.toggle('active',m);el('mobileBtn').querySelector('span').textContent=m?'桌面视图':'手机视图';
  toast(m?'已切换手机单列（侧栏收起、弹窗全屏）':'已切换桌面三栏');applyMeasure();
});
el('measureBtn').addEventListener('click',()=>{
  const on=!document.body.classList.contains('show-measure');
  document.body.classList.toggle('show-measure',on);el('measureBtn').classList.toggle('active',on);
  el('measureBtn').querySelector('span').textContent=on?'尺寸 ✓':'尺寸';
  toast(on?'已标注关键元素的真实 DOM 尺寸':'已关闭尺寸标注');applyMeasure();
});
el('dlg').addEventListener('click',e=>{if(e.target===el('dlg'))el('dlg').close()});

/* ── 尺寸标注 + 自检 ── */
function applyMeasure(){
  $$('[data-m]').forEach(n=>{const r=n.getBoundingClientRect();if(r.width>0)n.dataset.mSize=`${Math.round(r.width)}×${Math.round(r.height)}`});
  if(current==='notes')runSelfCheck();
}
function runSelfCheck(){
  const host=el('selfcheck');if(!host)return;
  const rows=[];
  const rect=s=>{const n=document.querySelector(s);return n?n.getBoundingClientRect():null};
  const add=(ok,label,value)=>rows.push(`<div class="sc ${ok?'':'bad'}"><i>${ok?'✓':'!'}</i><span>${label} <b>${value}</b></span></div>`);
  const btn=rect('[data-m="btn-new"]'), card=rect('[data-m="type-card"]'), dlgBtn=rect('[data-m="dlg-btn"]');
  add(!btn||btn.height>=36,'新建主按钮最小高度 ≥ 36px',btn?`${Math.round(btn.width)}×${Math.round(btn.height)}px`:'需打开启动台场景');
  add(!card||card.height>=80,'类型卡点击区 ≥ 80px 高',card?`${Math.round(card.width)}×${Math.round(card.height)}px`:'需打开含启动台的场景');
  add(!dlgBtn||dlgBtn.height>=36,'弹窗底栏按钮 ≥ 36px',dlgBtn?`${Math.round(dlgBtn.width)}×${Math.round(dlgBtn.height)}px`:'需打开弹窗');
  const main=document.querySelector('.sim-main'), stage=el('stage');
  add(!main||main.scrollWidth<=main.clientWidth+1,'三栏内容区无横向溢出',main?`${main.scrollWidth} / ${main.clientWidth}px`:'—');
  add(!stage||stage.scrollWidth<=stage.clientWidth+1,'舞台无横向溢出',stage?`${stage.scrollWidth} / ${stage.clientWidth}px`:'—');
  const mobile=document.body.dataset.mobile==='true';
  add(document.documentElement.scrollWidth<=window.innerWidth+1,'当前视口无横向滚动',`${document.documentElement.scrollWidth} / ${window.innerWidth}px`);
  const fs=n=>n?parseFloat(getComputedStyle(n).fontSize):0;
  const hint=document.querySelector('.hint');
  add(!hint||fs(hint)>=11,'最小字号 ≥ 11px',hint?`${fs(hint)}px`:'—');
  const wide=document.querySelector('.wide');
  add(!mobile||!wide||wide.scrollWidth<=wide.clientWidth+1,'手机视图内容区不溢出',mobile&&wide?`${wide.scrollWidth} / ${wide.clientWidth}px`:'当前为桌面');
  host.innerHTML=rows.join('');
}
window.addEventListener('resize',()=>applyMeasure());
render();
</script>
