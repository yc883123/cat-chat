name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 2.7.6-beta
  RELEASE_TAG: v2.7.6-beta
  PACKAGE_NAME: naiba-chat-2.7.6-beta-windows-x64

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pyinstaller pywebview pystray "mcp==2.1.1" pymupdf "av==18.1.0" python-multipart
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir pillow
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Run tests
        shell: pwsh
        run: |
          if (-not (Test-Path "tests")) {
            Write-Host "tests directory not found; skipping unit tests."
            exit 0
          }
          $attempts = 2
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $attempts) {
              Write-Host "Tests failed on attempt $attempt; retrying once."
            }
          }
          exit 1

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "${{ env.RELEASE_VERSION }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Create update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $releaseNotes = @(Get-Content -Raw -Encoding UTF8 release_notes.json | ConvertFrom-Json)
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "${{ env.RELEASE_VERSION }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = $releaseNotes
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Create Windows package
        shell: pwsh
        run: |
          $packageDir = Join-Path "dist" "${{ env.PACKAGE_NAME }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath "dist\naiba-chat.exe" -Destination $packageDir
          Copy-Item -LiteralPath "naiba-chat-update.json" -Destination $packageDir
          Copy-Item -LiteralPath "README.md" -Destination $packageDir
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\${{ env.PACKAGE_NAME }}.zip" -Force

      - name: Publish 2.7.6 Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Cat Chat 2.7.6 Beta
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            dist/${{ env.PACKAGE_NAME }}.zip
            naiba-chat-update.json
          body: |
            Cat Chat 2.7.6 Beta Windows build from `${{ github.sha }}`。

            **本次唯一变化：显示名改为 Cat Chat（原名 Naiba Chat）。** GitHub 仓库、`naiba-chat.exe`、更新资产与既有数据位置一律不动——直接覆盖安装即可，**不需要迁移数据，也不需要重新配置**；历史会话、API 卡片、Agent、Skill 与 MCP 配置原样保留。

            本次更新（完整清单见 `release_notes.json` / 应用内「更新说明」）：
            - 界面与操作入口的产品名改为 Cat Chat（共 19 处显示文案）：浏览器标签、桌面窗口标题、托盘悬停标题、原生对话框标题、手机访问与数据目录迁移提示、启动横幅与命令行帮助；名称大小写与空格固定为 Cat Chat。程序行为、接口与数据格式一处未改。
            - 机器认的身份一律保留：`yc883123/naiba-chat`、`naiba-chat.exe`、`naiba-chat-update.json` 与清单里的仓库 / 资产名 / SHA-256 校验；数据目录、`config.json`、`chat.db`、WebView2 profile 与全部本地存储键（`naibaChat*` 等）保持原值。改的是「人看的那一层」，因为 EXE 文件名与仓库地址一改，旧客户端的自动更新、既有快捷方式和用户数据路径会集体失配。
            - 已知保留项（不是漏改）：任务管理器 / 资源管理器属性里仍可能显示原文件名（本次没有为构建产物新增 Windows 版本资源）；历史版本说明与旧文档中的旧名原样保留，属正常历史记录。应用图标没有任何改动。

            本地验证：全量单测 1522 例通过（新增显示名品牌守门 28 例：显示名与内部标识各归各位）。

            The application verifies `naiba-chat.exe` against the SHA-256 value
            in `naiba-chat-update.json` before installing an update.
