name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 2.6.7-beta
  RELEASE_TAG: v2.6.7-beta
  PACKAGE_NAME: naiba-chat-2.6.7-beta-windows-x64

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pyinstaller pywebview pystray "mcp==2.1.1" pymupdf "av==18.1.0" python-multipart
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir pillow
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Run tests
        shell: pwsh
        run: |
          if (-not (Test-Path "tests")) {
            Write-Host "tests directory not found; skipping unit tests."
            exit 0
          }
          $attempts = 2
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $attempts) {
              Write-Host "Tests failed on attempt $attempt; retrying once."
            }
          }
          exit 1

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "${{ env.RELEASE_VERSION }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Create update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $releaseNotes = @(Get-Content -Raw -Encoding UTF8 release_notes.json | ConvertFrom-Json)
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "${{ env.RELEASE_VERSION }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = $releaseNotes
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Create Windows package
        shell: pwsh
        run: |
          $packageDir = Join-Path "dist" "${{ env.PACKAGE_NAME }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath "dist\naiba-chat.exe" -Destination $packageDir
          Copy-Item -LiteralPath "naiba-chat-update.json" -Destination $packageDir
          Copy-Item -LiteralPath "README.md" -Destination $packageDir
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\${{ env.PACKAGE_NAME }}.zip" -Force

      - name: Publish 2.6.7 Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Naiba Chat 2.6.7 Beta
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            dist/${{ env.PACKAGE_NAME }}.zip
            naiba-chat-update.json
          body: |
            Naiba Chat 2.6.7 Beta Windows build from `${{ github.sha }}`。

            本次更新（完整清单见 `release_notes.json` / 应用内「更新说明」）：
            - 未注册的工作区分组不再被显示成「未分组」（本次重点）：会话的分组名存在库里、工作区注册表存在 `config.json` 里，两台实例各存一份注册表必然分叉；此时下拉 `select.value = 当前分组名` 找不到对应选项会按 HTML 规范静默落成空字符串，界面于是把「属于 naiba-chat 的会话」显示成「未分组」——用户以为会话被搬走了，而且切走之后再也切不回来（那个分组在下拉里根本不存在）。现在会把该分组本身补回下拉、标注「（未注册）」，并在悬停提示里写清「当前值是什么、怎么恢复」（在侧栏「新建工作区」登记同名工作区即可）。补回来的分组只用于显示、绝不回写 config.json——注册表归谁由用户决定。
            - Agent 说明弹层（新增）：顶栏 Agent 选择器左侧多了一个「?」按钮，点开是说明弹层——Agent = 岗位角色（人设 + 工具箱 + 技能包，没勾选的工具一律用不了，工具箱在会话开始时锁定），三种预设 Agent 各自适合什么，以及 ComfyUI 出图的**两条路线**：HTTP 直连（启动本机 ComfyUI → 设置 → Agent 工具页一键套用「ComfyUI 联动」预设，不需要配 MCP）与 MCP 连接（设置 → MCP 连上服务后在工具页手动勾选 comfy 工具）。两条任选其一即可。
            - 工作区重名分不清 → 悬停看目录（新增）：分组按名字归并、允许重名，光看名字分不清；现在侧栏分组标题与下拉的每一项都带目录路径的悬停提示，下拉自身也显示当前选中项的目录。
            - 手机端长按粘贴（本次修复）：手机经局域网 `http://192.168.x.x:8765` 访问属非安全上下文，网页既没有 `navigator.clipboard`、`execCommand('paste')` 也被浏览器一律禁用，系统长按菜单是唯一可行的粘贴路径；而此前 `contextmenu` 对可编辑元素无条件 `preventDefault()`，等于把这条路一起关掉（用户实测「粘贴失败：浏览器未授权」）。现在触摸 / 手写笔长按直接放行给系统菜单（鼠标右键菜单照旧），提示也换成带动作的一句话（「请按 Ctrl+V，手机可长按输入框用系统菜单」）。
            - 顶栏「收起」以前等于没收（本次修复）：旧实现只隐藏操作区又把两个下拉收拢到第一行，用户看到的仍是「一行 API + 一行 Agent + 一条箭头」；现在收起态整条顶栏只剩折叠条一个按钮（`.topbar.compact > *:not(.topbar-collapse-toggle){display:none}`），并显示「展开顶栏」文字（此前只有一个 18px 小箭头，认不出这是唯一入口）。能力只是临时收起、点一下全部恢复。
            - 本地验证：全量单测 1262 例通过；新增隔离真实实例 + 无头 Edge 冒烟 `verify/agent_help_popover.py` 23 项断言（含「配置驱动的快捷卡片必须渲染齐」——静态取样会让配置驱动的 UI 整体消失而断言照样全绿）；顺带修好清理脚本会误删 7 个受版本控制脚本的名册漂移问题，并加守门单测锁住两份名册。

            The application verifies `naiba-chat.exe` against the SHA-256 value
            in `naiba-chat-update.json` before installing an update.
