name: Build and publish Windows update

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_VERSION: 2.6.10-beta
  RELEASE_TAG: v2.6.10-beta
  PACKAGE_NAME: naiba-chat-2.6.10-beta-windows-x64

concurrency:
  group: naiba-chat-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pyinstaller pywebview pystray "mcp==2.1.1" pymupdf "av==18.1.0" python-multipart
          python -m pip install --disable-pip-version-check --upgrade --force-reinstall --no-cache-dir pillow
          python -c "from PIL import Image; print('Pillow', Image.__version__)"

      - name: Run tests
        shell: pwsh
        run: |
          if (-not (Test-Path "tests")) {
            Write-Host "tests directory not found; skipping unit tests."
            exit 0
          }
          $attempts = 2
          for ($attempt = 1; $attempt -le $attempts; $attempt++) {
            python -m unittest discover -s tests -v
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt $attempts) {
              Write-Host "Tests failed on attempt $attempt; retrying once."
            }
          }
          exit 1

      - name: Build executable
        shell: pwsh
        run: |
          $env:NAIBA_BUILD_COMMIT = "${{ github.sha }}"
          $env:NAIBA_BUILD_VERSION = "${{ env.RELEASE_VERSION }}"
          python -m PyInstaller --noconfirm --clean naiba-chat.spec

      - name: Create update manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\naiba-chat.exe).Hash.ToLowerInvariant()
          $releaseNotes = @(Get-Content -Raw -Encoding UTF8 release_notes.json | ConvertFrom-Json)
          $manifest = [ordered]@{
            repository = "yc883123/naiba-chat"
            version = "${{ env.RELEASE_VERSION }}"
            commit = "${{ github.sha }}"
            asset = "naiba-chat.exe"
            sha256 = $hash
            published_at = (Get-Date).ToUniversalTime().ToString("o")
            release_notes = $releaseNotes
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 naiba-chat-update.json

      - name: Create Windows package
        shell: pwsh
        run: |
          $packageDir = Join-Path "dist" "${{ env.PACKAGE_NAME }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath "dist\naiba-chat.exe" -Destination $packageDir
          Copy-Item -LiteralPath "naiba-chat-update.json" -Destination $packageDir
          Copy-Item -LiteralPath "README.md" -Destination $packageDir
          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\${{ env.PACKAGE_NAME }}.zip" -Force

      - name: Publish 2.6.10 Beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Naiba Chat 2.6.10 Beta
          prerelease: false
          make_latest: true
          files: |
            dist/naiba-chat.exe
            dist/${{ env.PACKAGE_NAME }}.zip
            naiba-chat-update.json
          body: |
            Naiba Chat 2.6.10 Beta Windows build from `${{ github.sha }}`。

            本次更新（完整清单见 `release_notes.json` / 应用内「更新说明」）：
            - 工具调用前的「过程预告」不再堆进答案里（本次重点）：用 Agent 跑多步任务时，模型每轮调用工具前都会顺口说一句「我已定位根因」「继续验证」「现在补测试」，这些话此前每轮都被保留——一轮跑下来，最后那条回复里整整齐齐堆着十几句进度播报，真正的结论被埋在最后一句。根因在三层：流式层把工具协议之前的自然语言当作正常正文发出（这本身是设计如此、不该改），运行层把这十几段正文全部收进「活动时间线」，重建半截回复时又把它们全部拼回正文。现在三层统一口径——一段正文只有「最后一段」才有资格留在结果里：时间线只保留最后一段正文，重建时以「最后一次工具事件」为界、之前的累积正文一律丢弃（停在工具步上就是空正文，不吐半句废话）。历史消息同样受益：前端渲染时也只画最后一段正文，不必重算旧数据。
            - 系统提示补了一句「不许播报进度」（本次调整）：明确要求调用工具前不要输出过程预告或进度播报，也不要重复改写同一句进度；只在遇到真实阻塞、需要用户决策、或已启动长时间后台任务时，才用一句话说明。
            - Kimi K3 的工具调用不再漏进正文（本次修复）：K3 及其它 Harmony 风格兼容端点会把工具调用序列化成保留 token 混在普通文本里返回（`<|open|>tools<|sep|>...`），而不是返回原生的 function_call 项。此前这类输出既没被识别成工具调用、也没被拦住，结果是把整段协议原样吐在对话里。现在流式边界的协议守卫认这套 token（含被 SSE 切成两半的 `<|open|>to` + `ols`），跨包也能拦住；解析层同时支持并行多工具调用与参数类型还原（integer / boolean），截断的调用明确报「解析失败」而不是猜。
            - 本地验证：全量单测 1305 例通过；新增隔离真实实例 + 假 K3 模型冒烟 verify/tool_prefix_prose_smoke.py（4 轮工具调用，双向断言——既要证明流里确实出现过预告、前提成立，又要证明最终结果里只剩最后一段正文、工具活动 4 条齐全、预告一词不留），并做过回退反证（把修复退回旧写法后冒烟立刻变红）；前端渲染另加 6 项真实执行断言（verify/media_markup_check.mjs）；冻结版编译成功，并由冻结版入口自检 verify/frozen_tool_prose_check.py 确认 exe 内的时间线重建、半截回复重建与打包前端资源都是新代码（9 项）。

            The application verifies `naiba-chat.exe` against the SHA-256 value
            in `naiba-chat-update.json` before installing an update.
